<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ステージメモ</title>
<meta name="theme-color" content="#16141f">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- black-translucent は使わない。iOS 26 では「black-translucent + viewport-fit=cover」でアプリの表示領域がステータスバー1本分だけ
     下で足りなくなり（WebKit bug 301108、メニューの下に謎の空き）、ステータスバー下のぼかしで上部の文字も薄く見える。
     この設定はホーム画面に追加した時にしか読まれないので、変えたらアイコンを削除して追加し直す必要がある -->
<script>window.APP_VERSION = '2026-11-26g';</script>
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="ステージメモ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
/* デザインの決まり（2026-11-13 見直し）
   文字: 11（注記）/ 13（補足）/ 15（本文・名前）/ 17（画面タイトル）/ 22（WAVE番号）。太さは本文400・強調600・最大700（800/900は使わない）。
   日本語は palt で字間を詰め、数字は等幅。入力欄だけは16px（iPhoneでタップ時に拡大されないため）。
   枠は太い色線をやめ、細い線＋小さな色の点でモードを示す。 */
:root{
  --bg:#121019; --card:#1b1825; --card2:#252133; --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.14);
  --text:#ecebf3; --sub:#9b96ad; --faint:#686379;
  --salmon:#ff7a3d; --regular:#4fd27a; --bankara:#ff6a3d; --x:#2fd6a8; --event:#ff5aa5; --fest:#e6cf4a;
  --accent:#ff7a3d; --nav:#0e0d14;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* html は下メニューと同じ色。iOSがアプリの外側に塗る帯が出てもメニューの続きに見えるように */
html{background:var(--nav)}
html,body{margin:0;color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  font-size:15px;line-height:1.55;font-feature-settings:"palt" 1;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.num,.tgt b,.time,.pws,.count{font-variant-numeric:tabular-nums}
/* 画面全体を「上: ヘッダー / 中: スクロール領域 / 下: メニュー」の固定レイアウトにする。
   メニューを position:fixed で下に貼る方式は、ホーム画面アプリでメニューの下に謎の空きが出たため（WAVE画面と同じ方式に統一） */
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg)}
header{flex:none;z-index:5;background:var(--bg);
  padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:10px}
.hrow h1{font-size:17px;font-weight:700;margin:0;flex:1;letter-spacing:.02em}
.reload{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:12px;color:var(--sub)}
.status{font-size:11px;color:var(--faint);margin-top:1px}
.status.err{color:#ff8a8a}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px max(16px, calc((100% - 640px) / 2)) 28px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px;margin-bottom:14px}
.seg button{flex:1;padding:7px 4px;border-radius:7px;font-weight:600;font-size:13px;color:var(--sub)}
.seg button.on{background:var(--card2);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.3)}
.seg button.on.salmon{color:var(--salmon)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}
.chead{display:flex;align-items:center;gap:8px;padding:11px 14px 6px;flex-wrap:wrap}
.mode{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--c,var(--accent));font-size:12px;letter-spacing:.04em}
.mode::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c,var(--accent))}
.rule{font-weight:600;font-size:15px}
.time{margin-left:auto;font-size:11px;color:var(--faint)}
.extra{padding:0 14px 6px;font-size:12px;color:var(--sub)}
.weapons{display:flex;gap:6px;padding:2px 14px 10px}
.weapons img{width:38px;height:38px;background:var(--card2);border-radius:9px;padding:3px}
.stage{display:block;width:100%;text-align:left;padding:10px 14px 12px;border-top:1px solid var(--line)}
.stage:active{background:var(--card2)}
.shead{display:flex;align-items:center;gap:10px}
.shead img{width:64px;height:36px;object-fit:cover;border-radius:7px;background:var(--card2);flex:none}
.sname{font-weight:600;font-size:15px;flex:1}
.editbtn{font-size:11px;color:var(--sub);border:1px solid var(--line2);border-radius:999px;padding:2px 10px;flex:none}
.memo{margin-top:8px;background:var(--card2);border-radius:9px;padding:8px 10px;white-space:pre-wrap;word-break:break-word;font-size:14px;
  display:-webkit-box;-webkit-line-clamp:8;-webkit-box-orient:vertical;overflow:hidden} /* 長いメモは8行まで（全文は「編集」で。2026-11-23c、長いメモでほかのステージが遠くへ押し出されていた） */
.memo .lbl{display:inline-block;font-size:10px;font-weight:600;color:var(--sub);border:1px solid var(--line2);border-radius:4px;padding:0 5px;margin-bottom:3px;letter-spacing:.04em}
.memo .lbl.rule{color:var(--c,var(--accent));border-color:currentColor}
.memo + .memo{margin-top:6px}
.nomemo{margin-top:6px;font-size:12px;color:var(--faint)}
.nextbtn{width:100%;padding:11px;border:1px dashed var(--line2);border-radius:12px;color:var(--sub);font-size:13px;margin-bottom:14px}
.nexthead{font-size:11px;color:var(--faint);margin:4px 2px 8px;font-weight:600;letter-spacing:.06em}
.empty{color:var(--sub);text-align:center;padding:32px 8px;font-size:13px}
.list .row{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin-bottom:6px}
.list .row:active{background:var(--card2)}
.list .row img{width:60px;height:34px;object-fit:cover;border-radius:6px;background:var(--card2);flex:none}
.list .rinfo{flex:1;min-width:0}
.list .rname{font-weight:600;font-size:14px}
.list .rprev{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .rprev.none{color:var(--faint)}
.count{font-size:11px;color:var(--salmon);font-weight:600;flex:none}
.sec{font-size:11px;color:var(--faint);font-weight:600;margin:20px 2px 8px;letter-spacing:.06em}
.backup{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:12px;color:var(--sub)}
.backup .btns{display:flex;gap:8px;margin-top:10px}
.backup button,.backup label{flex:1;text-align:center;background:var(--card2);border-radius:9px;padding:9px;color:var(--text);font-weight:600;font-size:13px;cursor:pointer}
nav{flex:none;z-index:6;display:flex;background:var(--nav);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:8px 0 10px;font-size:10px;font-weight:600;color:var(--faint);display:flex;flex-direction:column;align-items:center;gap:3px;letter-spacing:.02em}
nav button svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--salmon)}
#unsaved{flex:none;display:flex;align-items:center;gap:8px;padding:8px 12px;background:#5a1d1d;border-bottom:1px solid #ff6b6b;color:#ffe3e3;font-size:13px;font-weight:600}
#unsaved[hidden]{display:none}
#unsaved span{flex:1}
#unsaved button{flex:none;min-height:40px;padding:0 12px;border-radius:9px;background:#ff6b6b;color:#1a1020;font-weight:700;font-size:13px}
/* 「その他」のメニュー（下のメニューの右端の上に出る） */
#moreMenu{position:fixed;right:8px;bottom:calc(64px + env(safe-area-inset-bottom));z-index:25;min-width:168px;background:var(--card2);border:1px solid var(--line2);border-radius:14px;padding:6px;box-shadow:0 10px 30px #000a}
#moreMenu[hidden]{display:none}
#moreMenu button{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:0 14px;border-radius:10px;font-size:15px;font-weight:600;color:var(--text);text-align:left}
#moreMenu button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;color:var(--sub)}
/* 初回だけの案内（2026-11-26、評価 F11・優先順位8） */
#intro{position:fixed;inset:0;z-index:60;background:#000b;display:flex;align-items:flex-end;justify-content:center;padding:16px 12px calc(16px + env(safe-area-inset-bottom))}
#intro[hidden]{display:none}
#intro .ib{width:100%;max-width:440px;background:var(--card2);border:1px solid var(--line2);border-radius:18px;padding:20px 18px 14px}
#intro .ip{font-size:12px;color:var(--sub);margin-bottom:6px}
#intro h2{font-size:19px;margin:0 0 10px}
#intro .it{font-size:15px;line-height:1.7;color:var(--text);min-height:7.5em}
#intro .it b{color:var(--salmon);font-weight:700}
#intro .ibtn{display:flex;gap:8px;margin-top:14px}
#intro .ibtn button{flex:1;min-height:48px;border-radius:12px;font-size:15px;font-weight:600;background:var(--card);border:1px solid var(--line2);color:var(--text)}
#intro .ibtn button.pri{background:var(--salmon);border-color:var(--salmon);color:#111}
#moreMenu .mm{display:flex;flex-direction:column;gap:1px;line-height:1.25}#moreMenu .mm small{font-size:12px;font-weight:400;color:var(--sub)}
#moreMenu button.on{color:var(--salmon)}#moreMenu button.on svg{color:var(--salmon)}
/* editor */
#editor{position:fixed;inset:0;z-index:20;background:var(--bg);display:none;flex-direction:column}
#editor.open{display:flex}
.ehead{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;border-bottom:1px solid var(--line)}
.back{padding:8px 8px 8px 2px;font-weight:600;font-size:15px;color:var(--accent)}
.etitle{flex:1;font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.saved{font-size:11px;color:var(--faint);min-width:84px;text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px 4px;max-height:30vh;overflow-y:auto;flex:none}
.chip{flex:none;padding:5px 11px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--sub);font-weight:600;font-size:13px;position:relative}
.chip.on{background:var(--accent);border-color:var(--accent);color:#1a1020}
.chip.has::after{content:"";position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--salmon)}
.chip.on.has::after{background:#fff}
.ehint{font-size:11px;color:var(--faint);padding:4px 14px 0}
#memoText{flex:1;margin:8px 12px calc(12px + env(safe-area-inset-bottom));padding:12px;border-radius:12px;border:1px solid var(--line);
  background:var(--card);color:var(--text);font:inherit;font-size:16px;line-height:1.6;resize:none;outline:none}
#memoText:focus{border-color:var(--line2)}
/* ばちこん */
.ccard{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}
.ccard .shead{padding:10px 14px}
.badge{display:inline-block;font-size:11px;font-weight:600;border-radius:999px;padding:2px 10px;margin:0 14px 10px}
.badge.has{background:rgba(255,122,61,.15);color:var(--salmon)}
.badge.new{background:var(--card2);color:var(--sub)}
.openbtn{display:block;width:calc(100% - 28px);margin:0 14px 14px;padding:11px;border-radius:10px;background:var(--salmon);color:#1a1020;font-weight:600;text-align:center;font-size:14px}
.blog{margin-top:10px;padding:8px 10px;border-radius:10px;background:var(--card);border:1px solid var(--line2);font-size:13px;line-height:1.6;color:var(--text)}
.blog b{display:block;font-size:12px;color:var(--sub);font-weight:600}
.blog.bad{border-color:var(--salmon)}.blog .miss{color:var(--salmon);margin-top:2px}
.blog.warn{border-color:var(--salmon);color:var(--salmon)}
.srcnote{font-size:10px;color:var(--faint);margin:14px 2px}
.srcnote a,.plinks a{color:var(--sub)}
#play{position:fixed;inset:0;z-index:20;background:var(--bg);display:none;flex-direction:column}
#play.open{display:flex}
#playBody{flex:1;overflow-y:auto;padding:14px 16px 20px;-webkit-overflow-scrolling:touch}
#waveBar{display:flex;gap:6px;padding:8px 10px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--nav)}
#waveBar button{flex:1;min-height:50px;border-radius:10px;background:var(--card);border:1px solid var(--line);color:var(--sub);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:4px 2px}
#waveBar button b{font-size:15px;font-weight:700}
#waveBar button small{font-size:9px;line-height:1.15;text-align:center}
#waveBar button.on{background:var(--salmon);border-color:var(--salmon);color:#1a1020}
.pw{margin-bottom:14px}
.pwn{font-size:22px;font-weight:700;line-height:1.15;letter-spacing:.03em}
.pwc{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap}
.tide{font-size:12px;font-weight:600;border-radius:6px;padding:2px 9px;letter-spacing:.04em}
.tLow{background:#d9b26a;color:#2a1d05}.tMid{background:#8f8aa6;color:#14121c}.tHigh{background:#4a90ff;color:#04122b}
.pev{font-size:14px;font-weight:600;color:var(--event)}
.pday{font-size:13px;color:var(--sub)}
.pws{font-size:11px;color:var(--faint);margin-top:6px}
.prec{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:-4px 0 12px}
.pf{display:flex;flex-direction:column;align-items:flex-start;gap:1px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 9px;text-align:left;min-height:48px;min-width:0;position:relative}
.pf span{font-size:10px;color:var(--faint);font-weight:600;letter-spacing:.04em}
.pf b{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.pf b.none{color:var(--faint);font-weight:400}
.pf b small{font-size:10px;color:var(--faint);font-weight:400;margin-left:4px}
.pf em{position:absolute;top:5px;right:7px;font-style:normal;font-size:9px;color:var(--faint)}
.pf select{width:100%;background:none;border:0;color:var(--text);font:inherit;font-size:16px;font-weight:600;padding:0;margin:-2px 0;-webkit-appearance:none;appearance:none}
.pmemo{background:rgba(255,122,61,.08);border:1px solid rgba(255,122,61,.28);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.pml{display:flex;align-items:center;justify-content:space-between;font-size:11px;font-weight:600;color:var(--salmon);letter-spacing:.06em}
.pml button{border:1px solid rgba(255,122,61,.35);border-radius:999px;padding:4px 12px;font-size:12px;color:var(--text);min-height:32px;letter-spacing:0}
.pmt{white-space:pre-wrap;word-break:break-word;font-size:15px;margin-top:4px}
.pmt.none{font-size:12px;color:var(--faint)}
.psec{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.psh{font-size:11px;font-weight:600;color:var(--faint);margin-bottom:6px;letter-spacing:.06em}
.capn{font-size:11px;color:var(--sub);margin:4px 0 6px}
.cond{display:inline-block;background:rgba(255,77,77,.16);color:#ff7b7b;font-size:11px;font-weight:600;border-radius:5px;padding:1px 6px;margin:2px 4px 2px 0}
.olist{margin:0;padding-left:1.6em}
.olist li{padding:4px 0;border-bottom:1px solid var(--line);font-size:14px}
.olist.big li{font-size:15px;font-weight:600}
.tg{display:grid;grid-template-columns:44px 1fr;column-gap:10px;border-top:1px solid var(--line);padding:7px 0}
.tg.late{opacity:.55}
.tgt{display:flex;flex-direction:column;align-items:center;line-height:1.05}
.tgt b{font-size:17px;font-weight:600;color:var(--text)}
.tgt small{font-size:9px;color:var(--faint)}
.tgt small:last-child{color:var(--sub)}
.tr{padding:2px 0 3px;font-size:14px}
.tr .dir{display:inline-block;border:1px solid var(--line2);border-radius:5px;padding:0 6px;margin-right:6px;font-size:12px;color:var(--sub)}
.tr .who{font-weight:600;margin-right:6px}
.tr .det{font-size:12px;color:var(--sub);margin-right:6px}
.tr .note{font-size:11px;color:var(--sub);margin-top:2px}
.nodata{font-size:13px;color:var(--faint);padding:6px 0}
.tl2{width:100%;text-align:left;min-height:48px}
.tl2:active{background:var(--card2)}
.mynote{font-size:15px;font-weight:600;white-space:pre-wrap;word-break:break-word;color:#ffc9a8;padding:2px 0}
.addnote{font-size:12px;color:var(--faint);padding-top:8px}
.tl2.late .addnote{display:none}
.tr.wk{font-size:13px;color:var(--sub)}
.tr.wk .who{color:var(--text);font-weight:600}
.tr .src{font-size:9px;color:var(--faint);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:4px}
.wspb{border:1px solid transparent;text-align:left;color:var(--text)}
.wspb.on{border-color:var(--salmon)}
.wspb em{font-style:normal;font-size:10px;color:var(--salmon)}
.sppick{background:var(--card2);border:1px solid rgba(255,122,61,.4);border-radius:12px;padding:10px;margin-top:10px}
.spgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.spgrid button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;border-radius:10px;background:var(--card);font-size:10px;line-height:1.2;color:var(--sub);min-height:44px}
.spgrid button img{width:40px;height:40px;background:#0b0a12;border-radius:9px;padding:4px}
.spgrid button.on{background:var(--salmon);color:#1a1020}
.fact{font-size:13px;padding:3px 0}
.fact span{display:inline-block;min-width:9em;color:var(--faint);font-size:11px}
.plinks{display:flex;gap:8px;margin-bottom:12px}
.plinks a{flex:1;text-align:center;padding:10px 6px;border-radius:10px;background:var(--card);border:1px solid var(--line);text-decoration:none;font-weight:600;font-size:13px;color:var(--text)}
.wsp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wspb{display:grid;grid-template-columns:36px 1fr;gap:2px 8px;align-items:center;background:var(--card2);border-radius:10px;padding:8px}
.wspb .wname{grid-column:1 / span 2;font-size:12px;font-weight:600}
.wspb .spi{width:36px;height:36px;background:#0b0a12;border-radius:9px;padding:4px}
.wspb .spn{font-size:11px;color:var(--sub)}
.restart{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);color:var(--sub);font-size:13px;margin-bottom:8px}
#editor{z-index:30}
.seg2{margin-top:-6px}
.seg2 button{padding:5px 4px;font-size:12px}
.wtools{display:flex;gap:8px;margin-bottom:10px}
.wtools input{flex:1;min-width:0;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;font-size:16px}
.wtools button{flex:none;padding:0 12px;border-radius:10px;background:var(--card);color:var(--sub);font-size:12px;font-weight:600;border:1px solid var(--line)}
.wtools button.on{background:var(--salmon);color:#1a1020;border-color:var(--salmon)}
.list .row img.wimg{width:40px;height:40px;object-fit:contain;background:var(--card2)}
.wbtn{position:relative;padding:0;border-radius:9px}
.weapons{flex-wrap:wrap} /* 幅の狭い端末では潮位のボタンが次の行へ回る */
.ctides{display:flex;gap:5px;margin-left:auto}
.ctide{min-width:40px;height:38px;padding:0 6px;border-radius:9px;background:var(--card2);border:1px solid var(--salmon);color:var(--salmon);font-size:12px;font-weight:700}
.ctide.none{border-color:var(--line);color:var(--faint);opacity:.55}
.wbtn.has::after{content:"";position:absolute;top:2px;right:2px;width:8px;height:8px;border-radius:50%;background:var(--salmon);border:2px solid var(--card)}

const LOC = 'https://splatoon3.ink/data/locale/ja-JP.json';

const FALLBACK_STAGES = {"VnNTdGFnZS0x":"ユノハナ大渓谷","VnNTdGFnZS0y":"ゴンズイ地区","VnNTdGFnZS0z":"ヤガラ市場","VnNTdGFnZS00":"マテガイ放水路","VnNTdGFnZS01":"ナンプラー遺跡","VnNTdGFnZS02":"ナメロウ金属","VnNTdGFnZS03":"クサヤ温泉","VnNTdGFnZS04":"タラポートショッピングパーク","VnNTdGFnZS05":"ヒラメが丘団地","VnNTdGFnZS0xMA==":"マサバ海峡大橋","VnNTdGFnZS0xMQ==":"キンメダイ美術館","VnNTdGFnZS0xMg==":"マヒマヒリゾート＆スパ","VnNTdGFnZS0xMw==":"海女美術大学","VnNTdGFnZS0xNA==":"チョウザメ造船","VnNTdGFnZS0xNQ==":"ザトウマーケット","VnNTdGFnZS0xNg==":"スメーシーワールド","VnNTdGFnZS0xNw==":"コンブトラック","VnNTdGFnZS0xOA==":"マンタマリア号","VnNTdGFnZS0xOQ==":"タカアシ経済特区","VnNTdGFnZS0yMA==":"オヒョウ海運","VnNTdGFnZS0yMQ==":"バイガイ亭","VnNTdGFnZS0yMg==":"ネギトロ炭鉱","VnNTdGFnZS0yMw==":"カジキ空港","VnNTdGFnZS0yNA==":"リュウグウターミナル","VnNTdGFnZS0yNg==":"デカライン高架下","Q29vcFN0YWdlLTY=":"難破船ドン・ブラコ","Q29vcFN0YWdlLTE=":"シェケナダム","Q29vcFN0YWdlLTI=":"アラマキ砦","Q29vcFN0YWdlLTc=":"ムニ・エール海洋発電所","Q29vcFN0YWdlLTQ=":"トキシラズいぶし工房","Q29vcFN0YWdlLTg=":"すじこジャンクション跡","Q29vcFN0YWdlLTk=":"どんぴこ闘技場","Q29vcFN0YWdlLTEwMA==":"スメーシーワールド","Q29vcFN0YWdlLTEwMg==":"海女美術大学","Q29vcFN0YWdlLTEwMw==":"マテガイ放水路","Q29vcFN0YWdlLTEwNA==":"ナンプラー遺跡","Q29vcFN0YWdlLTEwNQ==":"タラポートショッピングパーク","Q29vcFN0YWdlLTEwNg==":"ゴンズイ地区"};

// ---------- 保存 ----------
function load(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }
// メモ（sm_memos）の保存に失敗したら覚えておき、画面上の帯で知らせる（画面を閉じても消えない。成功したら消える）

}
window.drawUnsaved = drawUnsaved;

let memos = load('sm_memos', {});           // { key: text }
if (!memos || typeof memos !== 'object' || Array.isArray(memos)) memos = {};
// 「試合前に見る」印（2026-11-25c、評価の優先順位5。イカのメモの「お気に入りだけ試合前に見る」、コーチのリストバンドの考え）。印を付けたメモのキー
// メモを最後に書いた日時（2026-11-26、評価 F8・優先順位9「すべてのメモ」の更新日・並べ替え）。{ key: ミリ秒 }。
// 文字の保存に成功した時と、画像を付けた時に記録する。これより前に書いたメモは日時なし（「日付なし」として最後に並ぶ）

// 消したメモ（文字も画像も無い）の日時は残さない（後で日時の無い古いバックアップを読んだ時に「消した日」が更新日にならないように。Codexレビュー）。
// 文字も画像も残っているかは note.js の settleMemoAt が画像を数えて決める
window.touchMemo = ks => { const t = Date.now(); [].concat(ks).forEach(k => { memoAt[k] = t; }); return save('sm_memo_at', memoAt); };
window.dropMemoAt = k => { if (k in memoAt){ delete memoAt[k]; save('sm_memo_at', memoAt); } };
const validAt = v => typeof v === 'number' && Number.isFinite(v) && v > 0 && v <= Date.now() + 864e5; // バックアップの日時の確かめ（数値だけ）
let pins = new Set((Array.isArray(load('sm_pins', [])) ? load('sm_pins', []) : []).filter(k => typeof k === 'string'));
const isPinned = k => pins.has(k);
function togglePin(k){
  const on = !pins.has(k); if (on) pins.add(k); else pins.delete(k);
  if (!save('sm_pins', [...pins])){ if (on) pins.delete(k); else pins.add(k); toast('印を保存できませんでした'); return false; }
  return true;
}
window.isPinned = isPinned; window.togglePin = togglePin;
// メモを消した時に印も外す（後で同じ欄に書いた時に古い印が勝手に付かないように。Codexレビュー）
window.dropPin = k => { if (pins.delete(k)) save('sm_pins', [...pins]); };
// 印の付いたメモの最初の数行（いまのステージ・バトルメモ・サモランメモの「試合前に見る」で使う）
const pinLines = (v, n) => String(v || '').split(/\r?\n/).map(s => s.trim()).filter(Boolean).slice(0, n).join('\n');
function pinnedQuick(keys, title){
  const items = keys.filter(k => isPinned(k) && memoOf(k)).map(k => '<button class="quick-memo pin" data-memokey="' + esc(k) + '"><span>★ ' + esc(pinLabel(k)) + '</span><b>' + esc(pinLines(memoOf(k), 3)) + '</b></button>');
  return items.length ? '<div class="quick-memos"><div class="quick-title">' + esc(title || '試合前に見る') + '</div>' + items.join('') + '</div>' : '';
}
// 印の付いたメモの短い名前
function pinLabel(k){ const a = k.split(':'); return a[0] === 'coop' ? 'ステージ共通' : a[0] === 'al' ? (a[1] === 'coop' ? 'サモラン全体' : 'バトル全体') : a[0] === 'rl' ? ((typeof RULE_NAME !== 'undefined' && RULE_NAME[a[1]]) || 'ルール') + '共通' : a[0] === 'vs' ? (a[2] === 'all' ? 'ステージ共通' : ((typeof RULE_NAME !== 'undefined' && RULE_NAME[a[2]]) || '') + 'の時') : a[0] === 'td' ? (memoTides[a[2]] || '') + 'の時' : 'メモ'; }
let sched = load('sm_sched', null);         // { data, fetchedAt }
let loc = load('sm_locale', null);          // ja-JP locale
// サモラン会場は全ステージ一覧がAPIに無いので、画像URLを持っておく。
// 画像名は内部名（Cop_xxx）のSHA256。ビッグランは Cop_<バトルステージの内部名>
const COOP_IMG_HASH = {
  'Q29vcFN0YWdlLTE=':'be584c7c7f547b8cbac318617f646680541f88071bc71db73cd461eb3ea6326e',      // シェケナダム Cop_Shakeup
  'Q29vcFN0YWdlLTI=':'3418d2d89ef84288c78915b9acb63b4ad48df7bfcb48c27d6597920787e147ec',      // アラマキ砦 Cop_Shakespiral
  'Q29vcFN0YWdlLTQ=':'630d89698e3e260ef12cb2a32e1cb2c4c83c0e58fc882762da1fa2cea19a5260',      // トキシラズ Cop_Shakelift
  'Q29vcFN0YWdlLTY=':'1a29476c1ab5fdbc813e2df99cd290ce56dfe29755b97f671a7250e5f77f4961',      // ドン・ブラコ Cop_Shakeship
  'Q29vcFN0YWdlLTc=':'f1e4df4cff1dc5e0acc66a9654fecf949224f7e4f6bd36305d4600ac3fa3db7b',      // ムニ・エール Cop_Shakedent
  'Q29vcFN0YWdlLTg=':'0e05d4caa34089a447535708370286f4ee6068661359b4d7cf6c319863424f84',      // すじこ Cop_Shakehighway
  'Q29vcFN0YWdlLTk=':'5f09625c9031652ca1edcf8028265b03ecc28475ab3d56910960a68430d7948a',      // どんぴこ Cop_Shakerail
  'Q29vcFN0YWdlLTEwMA==':'2276a46e42a11637776ebc15cf2d46a589f1dba34a76d5c940c418ed7371d071',  // スメーシー Cop_Carousel
  'Q29vcFN0YWdlLTEwMg==':'3598b7f54248b84c47cde6b99aa45ff296a41d3d5f38eaccfe2327b2874fff0b',  // 海女美 Cop_Upland
  'Q29vcFN0YWdlLTEwMw==':'71c7076fc2d23f1833c923747e8582e29eb275bed96d8360aa5d0ed6ae069230',  // マテガイ Cop_Temple
  'Q29vcFN0YWdlLTEwNA==':'5894ed09915957be54e5b1eb58c4c52a9d5d89a99b1297e6d06eac07d47196d0',  // ナンプラー Cop_Factory
  'Q29vcFN0YWdlLTEwNQ==':'e7736b82a0a9b5c4b3777676f6d2d63ac3c612f1cd63df403153e77564c98b62',  // タラポート Cop_Section
  'Q29vcFN0YWdlLTEwNg==':'30ad09621e6e7e525a2b30fc02ad11d33aadb1aae9e8ef5bd6cca6aef3db778c',  // ゴンズイ Cop_District
};
const COOP_IMG = Object.fromEntries(Object.entries(COOP_IMG_HASH).map(([id, h]) =>
  [id, 'https://assets.splatoon3.ink/splatnet/v3/stage_img/icon/low_resolution/' + h + '_1.png']));
let stageImg = Object.assign({}, COOP_IMG, load('sm_stageimg', {}));     // { stageId: url } 一覧で画像を出すための控え
const ui = Object.assign({ view:'now', nowSub:'salmon', listSub:'salmon', listKind:'search', showNext:false }, load('sm_ui', {}));
// 起動時は「いまのステージ」か「ばちこん」から始める（一番大事な使い方: 開いた瞬間に今のメモが見える）。
// メモやティアを開いたまま閉じても、次に起動した時はそこへは戻さない
if (ui.view !== 'now' && ui.view !== 'contest' && ui.view !== 'note' && ui.view !== 'cnote') ui.view = 'now'; // note（バトルのメモ帳・試作）も開いた画面として残す
let fetchError = false, loading = false;

const kCoop = id => 'coop:' + id;
const kVs = (id, rule) => 'vs:' + id + ':' + (rule || 'all');
const memoOf = k => typeof memos[k] === 'string' ? memos[k].trim() : '';

// ---------- 名前 ----------
function stageName(s){ return (loc && loc.stages && loc.stages[s.id] && loc.stages[s.id].name) || FALLBACK_STAGES[s.id] || s.name; }
function nameById(id){ return (loc && loc.stages && loc.stages[id] && loc.stages[id].name) || FALLBACK_STAGES[id] || id; }
function ruleName(r){ return RULE_NAME[r.id] || (loc && loc.rules && loc.rules[r.id] && loc.rules[r.id].name) || r.name; }
function ruleFull(r){ return (loc && loc.rules && loc.rules[r.id] && loc.rules[r.id].name) || ruleName(r); }
function bossName(b){ return b ? ((loc && loc.bosses && loc.bosses[b.id] && loc.bosses[b.id].name) || b.name) : ''; }
function weaponName(w){ return (loc && loc.weapons && loc.weapons[w.__splatoon3ink_id] && loc.weapons[w.__splatoon3ink_id].name) || w.name; }
function eventName(e){ return (loc && loc.events && loc.events[e.id] && loc.events[e.id].name) || e.name; }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ---------- 時刻 ----------
const WD = ['日','月','火','水','木','金','土'];
function hm(d){ return d.getHours() + ':' + String(d.getMinutes()).padStart(2,'0'); }
function sameDay(a,b){ return a.toDateString() === b.toDateString(); }
function fmtRange(s, e, now){
  s = new Date(s); e = new Date(e);
  if (sameDay(s,e) && sameDay(s,now)) return hm(s) + '〜' + hm(e);
  const md = d => (d.getMonth()+1) + '/' + d.getDate() + '(' + WD[d.getDay()] + ') ';
  return md(s) + hm(s) + '〜' + (sameDay(s,e) ? '' : md(e)) + hm(e);
}
function inRange(n, now){ return new Date(n.startTime) <= now && now < new Date(n.endTime); }
function curAndNext(nodes, now){
  nodes = (nodes || []).filter(n => new Date(n.endTime) > now);
  const cur = nodes.find(n => inRange(n, now)) || null;
  const next = nodes.find(n => new Date(n.startTime) >= (cur ? new Date(cur.endTime) : now)) || null;
  return { cur, next };

async function fetchJSON(url){

}
async function fetchJSON0(url, signal){

  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
async function refresh(force){

    const needLoc = force || !loc || !loc._at || (Date.now() - loc._at > 3*24*3600e3);
    if (needLoc) fetchJSON(LOC).then(l => {

function rememberStageImages(){

  const small = u => u.replace('/high_resolution/', '/low_resolution/').replace(/_0\.png$/, '_1.png');
  (d.vsStages && d.vsStages.nodes || []).forEach(s => { if (s && s.id && s.originalImage && s.originalImage.url) stageImg[s.id] = small(s.originalImage.url); });
  const put = s => { if (s && s.id && s.image && s.image.url) stageImg[s.id] = s.image.url; };
  ['regularSchedules','bankaraSchedules','xSchedules','festSchedules'].forEach(k => ((d[k]||{}).nodes||[]).forEach(n => {
    Object.values(n).forEach(v => [].concat(v || []).forEach(st => st && st.vsStages && st.vsStages.forEach(put)));
  }));
  const coop = d.coopGroupingSchedule || {};
  ['regularSchedules','bigRunSchedules','teamContestSchedules'].forEach(k => ((coop[k]||{}).nodes||[]).forEach(n => {

// 時間帯が切り替わっていたら取り直す（ホーム画面アプリは開きっぱなしで復帰することがあるため）
function stale(){
  if (!sched) return true;
  const now = Date.now();
  if (now - sched.fetchedAt > 30*60e3) return true;
  // 取得したあとに新しい時間帯が始まっていたら取り直す
  const d = sched.data, c = d.coopGroupingSchedule || {};
  const nodes = [].concat((d.bankaraSchedules||{}).nodes || [], (c.regularSchedules||{}).nodes || []);
  return nodes.some(n => { const s = new Date(n.startTime).getTime(); return s > sched.fetchedAt && s <= now; });

function memoLocation(key){

  if (kind === 'coach') return coachTitle(id);

  if (kind === 'al') return category(id) + '全体';
  if (kind === 'wk') return category(id) + '・ブキのカテゴリ・' + (typeof catName === 'function' ? catName(detail) : detail);
  if (kind === 'rl') return 'バトル・' + (RULE_NAME[id] || id) + '・ルール共通';
  if (['wc','wv','bs'].includes(kind)) return (kind === 'wv' ? 'バトル' : 'サーモンラン') + '・' + tierItemName(kind, id);

  try { if (window.memoPicKeys) images = await memoPicKeys(); } catch (e){ picsFailed = true; }
  if (!results.isConnected || request !== memoSearchRequest) return;
  const pictureKeys = new Set(images);

function matchByNames(stageId, names){
  names = names.map(nfkc);
  // シナリオごとに一番よく一致した開催回を集め、別シナリオが同点なら「判定できない」にする
  const bySc = {};

    const s = (x.weapons || []).filter(w => names.includes(nfkc(w.name))).length;
    const cur = bySc[x.scenario];
    if (!cur || s > cur.s || (s === cur.s && x.no > cur.x.no)) bySc[x.scenario] = { x, s };
  });
  const ranked = Object.values(bySc).sort((a, b) => b.s - a.s);
  if (!ranked.length || ranked[0].s < 3) return null;
  if (ranked[1] && ranked[1].s === ranked[0].s) return null;
  return ranked[0].x;
}

// [キケン度の下限, n]。丸めた間隔を足し続けると誤差で28秒が27.9秒になるので、毎回 100 - i*72/n で計算する
const SPAWN_BANDS = [[333, 9], [266.6, 8], [200, 7], [150, 6], [100, 5], [60, 4], [20, 3], [0, 2]];
function spawnN(danger){ const d = parseFloat(danger); return (SPAWN_BANDS.find(([min]) => d >= min) || [0, 4])[1]; }
function spawnInterval(danger){ return Math.round(72 / spawnN(danger) * 10) / 10; }
function spawnTimes(danger){
  const n = spawnN(danger), out = [];
  for (let i = 0; 100 - i * 72 / n > 0.5; i++) out.push(Math.round((100 - i * 72 / n) * 10) / 10);
  return out;
}
const fmtT = t => String(Math.round(t * 10) / 10);
const ctKey = (sid, wave, t) => 'ct:' + sid + ':' + wave + ':' + fmtT(t);
// 湧き時刻の行に、wikiの表の行（±1秒以内なら同じ行）と、自分で足した時刻のメモを集める
function buildTimeline(sid, n, danger, timeTables){
  const times = spawnTimes(danger), rows = new Map();
  // exact=true（自分のメモの時刻）は寄せずにその秒の行を作る。メモのキーと行の秒を一致させるため
  const slot = (t, exact) => { const near = exact ? null : times.find(x => Math.abs(x - t) <= 1); const k = fmtT(near != null ? near : t);
    if (!rows.has(k)) rows.set(k, { t: parseFloat(k), wiki: [] }); return rows.get(k); };
  times.forEach(t => slot(t, true));
  timeTables.forEach(b => {
    const H = b.head, it = colIdx(H, /^タイム$/), idir = colIdx(H, /^方角$/), idir2 = colIdx(H, /^方角\(詳細\)$/),
      iwho = colIdx(H, /オオモノ|ブキ名/), idet = colIdx(H, /^詳細/), inote = colIdx(H, /備考/);
    const used = new Set([it, idir, idir2, iwho, idet, inote].filter(x => x >= 0));
    b.rows.forEach(r => {
      const t = firstNum(r[it]); if (isNaN(t)) return;
      const extra = r.map((v, k) => used.has(k) || !v ? '' : (H[k] || '') + ': ' + v).filter(Boolean).join(' / ');
      slot(t).wiki.push({ dir: [idir >= 0 ? r[idir] : '', idir2 >= 0 ? r[idir2] : ''].filter(Boolean).join(' '),
        who: iwho >= 0 ? r[iwho] : '', det: idet >= 0 ? r[idet] : '', note: [inote >= 0 ? r[inote] : '', extra].filter(Boolean).join(' / ') });
    });
  });
  const p = 'ct:' + sid + ':' + n + ':';
  Object.keys(memos).forEach(k => { if (k.startsWith(p) && memoOf(k)) { const t = parseFloat(k.slice(p.length)); if (!isNaN(t)) slot(t, true); } });
  return [...rows.values()].sort((a, b) => b.t - a.t);
}
// 時刻の無い表（ドロシャケのカンケツセン順など）
function plainTable(b){
  return '<ol class="olist">' + b.rows.map(r => '<li>' + esc(r.map((v, k) => v ? (b.head[k] && r.length > 1 ? b.head[k] + ': ' : '') + v : '').filter(Boolean).join(' ／ ')) + condBadges(r.join(' ')) + '</li>').join('') + '</ol>';
}
function listTitle(w){
  if (w.event === 'グリル発進') return 'グリルに狙われる順（ブキ）';
  if (w.event === 'キンシャケ探し') return 'キンシャケが出るカンケツセンの順（移動経路）';
  return '順番';
}
function capNote(cap){
  if (!cap) return '';
  const m = cap.match(/キケン度\s*(\d+%)/);
  return '<div class="capn">' + (m ? '<span class="cond">キケン度' + m[1] + 'のときの表</span> 他のキケン度では数や種類が違うことがあります' : esc(cap)) + '</div>';
}

  // イベントの主役（グリルの狙われ順・キンシャケの出現順など）
  lists.forEach(b => {
    h += '<div class="psec"><div class="psh">' + esc(listTitle(w)) + '</div>' + capNote(b.caption) + '<ol class="olist big">' + b.items.map(x => '<li>' + esc(x) + '</li>').join('') + '</ol></div>';

  otherTables.forEach(b => { h += '<div class="psec"><div class="psh">' + esc(b.head.filter(Boolean).join('・')) + '</div>' + capNote(b.caption) + plainTable(b) + '</div>'; });

    (s.detail ? '' : '<div class="capn">このシナリオはwikiに湧きの詳細がありません（潮位とイベントのみ判明）</div>') + '</div>';
  // 補足の項目（タマヒロイ方向など）
  const facts = w.facts.filter(([k]) => !/タマヒロイ/.test(k)); // タマヒロイは上の記録欄に出す

  // マップ・出典
  const internal = COOP_INTERNAL[s.stage], tk = TIDE_KEY[w.tide];
  h += '<div class="plinks">' + (internal && tk ? '<a href="https://salmon-learn-nw.gungee.jp/map/?stage=' + internal + '&tide=' + tk + '" target="_blank" rel="noopener">🗺 マップ（' + esc(w.tide) + '）</a>' : '') +

let bwThumbUrl = null, bwThumbSeq = 0; // WAVE画面の作戦図の絵（自分のスクショの時の Object URL）と描き直しの世代
function releaseBwThumb(){ if (bwThumbUrl){ URL.revokeObjectURL(bwThumbUrl); bwThumbUrl = null; } }
// キケン度を選ぶと、そのキケン度の湧き時刻で時系列を並べ直す（最大値を選んだら記録を消して既定に戻す）
document.getElementById('play').addEventListener('change', e => {
  if (!play) return;
  const s = scenById(play.sid), w = s && s.waves[play.wave], n = play.wave + 1; if (!w) return;
  if (e.target.dataset.dg){
    // 計算した値（無ければ最大値）と同じなら記録を消して、自動に戻す
    const k = dgKey(play.sid, n), v = parseInt(e.target.value, 10);
    if (v === (autoDanger(play.sid, n) || parseInt(w.danger, 10) || 60)) delete memos[k]; else memos[k] = String(v);
  } else if (e.target.dataset.nb != null){
    const k = nbKey(play.sid, n);
    if (e.target.value) memos[k] = e.target.value; else delete memos[k];
  } else return;
  if (!save('sm_memos', memos)) toast('保存できませんでした');
  drawPlay(false);
});
document.getElementById('play').addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t || !play) return;
  if (t.dataset.wave != null) setWave(+t.dataset.wave);
  else if (t.dataset.restart) setWave(0);
  else if (t.dataset.cmEdit) openEditor('cm', String(play.sid), String(play.wave + 1));
  else if (t.dataset.th) openEditor('th', String(play.sid), String(play.wave + 1));
  else if (t.dataset.bwave && window.openBoardPlace){
    const s = scenById(play.sid), w = s.waves[play.wave], n = play.wave + 1;
    const placeKey = 'c:' + s.stage + ':' + (TIDE_KEY[w.tide] || 'Mid'), bid = memoOf('bd:' + s.id + ':' + n);
    if (e.target.closest('[data-bwchg]') || !bid){ openBoardPlace(placeKey, { sid: s.id, wave: n }); return; }
    const at = play;
    boardMeta(bid).then(b => {
      if (play !== at || !play || play.wave + 1 !== n) return; // 待つ間に閉じた・WAVEを変えた
      if (b) openBoardById(bid, { edit: false, wave: n }); else openBoardPlace(placeKey, { sid: s.id, wave: n });
    });
  }
  else if (t.dataset.ct != null) openEditor('ct', String(play.sid), (play.wave + 1) + ':' + fmtT(parseFloat(t.dataset.ct)));
  else if (t.dataset.ctAdd){
    const raw = nfkc(prompt('残り何秒のメモを追加しますか？（1〜100、例: 55）') || '').trim().replace(/秒$/, '');
    if (!raw) return;
    const v = /^\d{1,3}(\.\d)?$/.test(raw) ? Number(raw) : NaN;
    if (!(v >= 1 && v <= 100)) { alert('1〜100の数字で入力してください（小数は1桁まで）'); return; }
    openEditor('ct', String(play.sid), (play.wave + 1) + ':' + fmtT(v));
  }
  else if (t.dataset.wmemo){
    const id = coopWeaponIdByName(t.dataset.wmemo);
    if (id) openEditor('wc', id, null); else toast('このブキのデータが見つかりません');
  }
  else if (t.dataset.spw != null){ spPick = spPick === +t.dataset.spw ? null : +t.dataset.spw; drawPlay(false); }
  else if (t.dataset.sppick != null){
    const k = spKey(play.sid, spPick);
    const before = memos[k];
    if (t.dataset.sppick) memos[k] = t.dataset.sppick; else delete memos[k];
    if (!save('sm_memos', memos)){ if (before === undefined) delete memos[k]; else memos[k] = before; toast('保存できませんでした'); }
    spPick = null; drawPlay(false);
  }
});
// 開催中のばちこんがあれば、ばちこんタブを開いたときに直接シナリオを出す
function liveContest(){
  const n = contestNodes().find(x => inRange(x, new Date()));
  const m = n && matchContest(n);
  return m ? { node: n, inst: m } : null;
}
function maybeAutoOpen(){
  if (ui.view !== 'contest' || play || ed || autoOpened) return;
  const lc = liveContest();
  if (lc){ autoOpened = true; openPlay(lc.inst.scenario, lc.inst.no, lc.node.startTime); }
}
// 旧版で手入力したシナリオ記録を、作戦メモに一度だけ書き写す（元の記録は残す）
// 壊れた記録は1件ずつ飛ばし、内蔵データが読めて保存に成功した時だけ「移行済み」にする。バックアップ読み込み後にも呼ぶ
function migrateOldContests(force){
  if (!force && load('sm_contests_migrated', false)) return;
  if (!CD.scenarios.length || !CD.instances.length) return;
  Object.values(contests || {}).forEach(c => {
    try{
      if (!c || !Array.isArray(c.waves)) return;
      const x = matchByNames(c.stageId, Array.isArray(c.weapons) ? c.weapons.map(w => w && w.name) : []);
      if (!x) return;
      c.waves.forEach((w, i) => {
        if (!w) return;
        const lines = (Array.isArray(w.rows) ? w.rows : []).filter(r => r && (r.where || r.what)).map(r => '残り' + r.t + '秒 ' + [r.where, r.what].filter(Boolean).join(' '));
        if (typeof w.note === 'string' && w.note.trim()) lines.push(w.note.trim());
        if (typeof w.event === 'string' && w.event) lines.unshift('（前の記録）' + w.event);
        const k = cmKey(x.scenario, i + 1);
        if (lines.length && !memoOf(k)) memos[k] = lines.join('\n');
      });
    }catch(e){ /* この記録だけ飛ばす */ }
  });
  if (save('sm_memos', memos)) save('sm_contests_migrated', true);
}
migrateOldContests(false);

let toastTimer;
function toast(t){ clearTimeout(toastTimer); const el = document.getElementById('toast'); el.textContent = t; el.classList.add('show'); toastTimer = setTimeout(() => el.classList.remove('show'), 2200); }
async function exportMemos(){
  const d = new Date(), stamp = d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
  // 作戦図（土台の画像を含む）はIndexedDBから読んで一緒に書き出す
  const [boards, notePics] = await Promise.all([
    window.exportBoards ? exportBoards() : null,
    window.exportNotePics ? exportNotePics() : null
  ]);
  const missing = [];
  if (!boards) missing.push('作戦図と土台');
  else if (window.boardFailCount && boardFailCount()) missing.push('作戦図の未保存の変更');
  if (!notePics) missing.push('メモに付けた画像');
  if (missing.length && !confirm('このバックアップに入らない内容があります。\n' + missing.join('・') + '\n\n入れられる内容だけを書き出しますか？')) return;
  const blob = new Blob([JSON.stringify({ app:'splat-stage-memo', version:4, exportedAt:d.toISOString(), memos, contests, tiers: window.getTierStore ? getTierStore() : undefined, boards: boards || undefined, notePics: notePics && notePics.length ? notePics : undefined, pins: [...pins], memoAt })], { type:'application/json' });
  const name = 'stage-memo-' + stamp + '.json';
  // 書き出せた時だけ記録する（共有シートを閉じた時は記録しない）
  const logExp = how => saveBackupLog('exp', { at: Date.now(), how, memos: Object.keys(memos).filter(k => memoOf(k)).length, pics: notePics ? notePics.length : 0,
    boards: boards && Array.isArray(boards.boards) ? boards.boards.length : 0, bases: boards && boards.bases ? Object.keys(boards.bases).length : 0,
    tiers: window.getTierStore ? Object.keys((getTierStore() || {}).lists || {}).length : 0, kb: Math.max(1, Math.round(blob.size / 1024)), miss: missing });
  // 読み込みの上限（250MB）を超えるファイルは、作っても戻せないので先に知らせる
  if (blob.size > 250e6 && !confirm('書き出すファイルが大きすぎて（' + Math.round(blob.size / 1e6) + 'MB）、このアプリで読み込めない大きさです。使っていない作戦図や画像を消してから書き出すのがおすすめです。このまま書き出しますか？')) return;
  try{
    const file = new File([blob], name, { type:'application/json' });
    if (navigator.canShare && navigator.canShare({ files:[file] })){ await navigator.share({ files:[file], title:name }); logExp('share'); return; }
  }catch(e){ if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); logExp('download'); // ダウンロードは始めた所までしか分からない（保存できたかは確かめられない）
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
function importMemos(file){
  // 画像入りでも普通は数MB。大きすぎるファイルは読まない（メモリを使い切らないように）
  if (file.size > 250e6){ alert('ファイルが大きすぎます（250MBまで）。「書き出す」で作ったファイルを選んでください。'); return; }
  const r = new FileReader();
  r.onload = () => {
    try{
      const j = JSON.parse(r.result);
      const m = j && j.memos;
      if (!m || typeof m !== 'object' || Array.isArray(m)) throw 0;
      const cs = (j.contests && typeof j.contests === 'object') ? j.contests : {};
      const n = Object.keys(m).length, nc = Object.keys(cs).length;
      if (!confirm(n + '件のメモ' + (nc ? 'と' + nc + '件のばちこんシナリオ' : '') + 'を読み込みます。同じものは上書きされます（それ以外は残ります）。よろしいですか？')) return;
      let nImp = 0, nBad = 0; // 結果の内訳用: 入れたメモ・入れられなかったメモ
      for (const [k0, v] of Object.entries(m)){
        if (typeof v !== 'string' || !/^(coop|vs|cm|ct|sp|wc|wv|bs|th|dg|nb|bd|sb|rl|cw|al|wk|td|coach):/.test(k0)){ nBad++; continue; }
        let k = k0;
        // 秒のメモは「64.0」などの書き方を揃える（表示側のキーと一致させるため）
        const mt = k0.match(/^(ct:\d+:\d+:)([\d.]+)$/);
        if (mt){ if (isNaN(parseFloat(mt[2]))){ nBad++; continue; } k = mt[1] + fmtT(parseFloat(mt[2])); }
        nImp++;
        if (window.noteForget) noteForget(k);
        const prev = memos[k], join = prev && prev !== v && k !== k0;
        memos[k] = join ? prev + '\n' + v : v;
        // 更新日（Codexレビュー）: 本文を置き換えた時は、採用した本文（バックアップ）の日時。無ければ日時なし。
        // つなげた時・同じ本文の時は、両方の新しい方
        const ta = j.memoAt && typeof j.memoAt === 'object' ? j.memoAt[k0] : undefined;
        if (join || prev === v){ if (validAt(ta) && !(memoAt[k] >= ta)) memoAt[k] = ta; }
        else if (validAt(ta)) memoAt[k] = ta; else delete memoAt[k];
      }
      let ncOk = 0; for (const [k, v] of Object.entries(cs)) if (v && Array.isArray(v.waves) && v.stageId){ contests[k] = v; ncOk++; }

      if (savedMemos) save('sm_memo_at', memoAt); else atUnsaved = true; // 更新日は本文を保存できてから（本文だけ失敗して日時だけ新しくならないように）
      if (nc) migrateOldContests(true);
      // 「試合前に見る」印は足し合わせる（メモのキーの形のものだけ）
      let pinsOk = true;
      if (Array.isArray(j.pins)){ const before = new Set(pins); j.pins.forEach(k => { if (typeof k === 'string' && /^(coop|vs|wv|wc|bs|sb|rl|cw|al|wk|td):.+/.test(k) && k.length < 200) pins.add(k); }); if (!save('sm_pins', [...pins])){ pins = before; pinsOk = false; } }
      const nt = j.tiers && window.mergeTierStore ? mergeTierStore(j.tiers) : 0;
      render(); toast(!savedMemos || !savedContests ? '読み込んだ内容を端末に保存できませんでした' : nt < 0 ? 'メモは読み込みましたが、ティアリストは保存できませんでした' : !pinsOk ? 'メモは読み込みましたが、「試合前」の印は保存できませんでした' : '読み込みました' + (nt ? '（ティアリスト' + nt + '件）' : ''));
      // 結果の内訳（作戦図・画像は後から足す）
      const imp = { at: Date.now(), memos: savedMemos ? nImp : 0, contests: savedContests ? ncOk : 0, tiers: nt > 0 ? nt : 0, boards: 0, bases: 0, pics: 0, miss: [] };
      if (!savedMemos) imp.miss.push('メモ' + nImp + '件（端末に保存できませんでした）');
      if (ncOk && !savedContests) imp.miss.push('ばちこんの記録');
      if (nc > ncOk) imp.miss.push('ばちこんの記録' + (nc - ncOk) + '件（形が違って使えない）');
      if (nt < 0) imp.miss.push('ティアリスト');
      if (!pinsOk) imp.miss.push('「試合前」の印');
      if (nBad) imp.miss.push('このアプリで使えない項目' + nBad + '件');
      const pB = j.boards && window.importBoards, pP = Array.isArray(j.notePics) && window.importNotePics;
      imp.pending = !!(pB || pP); saveBackupLog('imp', imp);
      const waits = [];
      // 作戦図は非同期で読み込む（今ある作戦図は消さずに追加）
      if (pB) waits.push(importBoards(j.boards).then(r => {
        imp.boards = r.boards || 0; imp.bases = r.bases || 0;
        if (r.skipBoards) imp.miss.push('作戦図' + r.skipBoards + '件');
        if (r.skipBases) imp.miss.push('土台の画像' + r.skipBases + '枚' + (r.noBase ? '（それを使う作戦図' + r.noBase + '件は土台なしで入れました）' : ''));

        return r;
      }).then(r => {
        // 作戦図が別のIDで入った場合は、読み込んだWAVEの割り当て（bd:）をその新しいIDに付け替える
        let fixed = false;
        for (const [k, v] of Object.entries(m)) if (/^bd:/.test(k) && typeof v === 'string' && r.idMap[v] && r.idMap[v] !== v){ memos[k] = r.idMap[v]; fixed = true; }

        if (r.boards || r.bases) toast('作戦図' + r.boards + '件・土台' + r.bases + '枚を読み込みました' + (r.skipped ? '（' + r.skipped + '件は読み込めませんでした' + (r.noBase ? '。作戦図' + r.noBase + '件は土台の画像なしで入れました' : '') + '）' : r.err ? '（一部読めないものがありました）' : ''));
        else if (r.err) toast('作戦図を読み込めませんでした');

      // メモの画像も非同期で読み込む（今ある画像は消さずに追加）。作戦図のお知らせと重ならないよう少し後に出す
      if (pP) waits.push(importNotePics(j.notePics).then(r => {

          let ch = false; keys.forEach(k => { const ta = j.memoAt[k]; if (!(k in m) && validAt(ta) && !(memoAt[k] >= ta)){ memoAt[k] = ta; ch = true; } });
          if (ch){ save('sm_memo_at', memoAt); if (ui.view === 'list' && ui.listKind === 'search') fillMemoSearch(); }
        }).catch(() => {});
        if (ui.view === 'list' && ui.listKind === 'search') fillMemoSearch();
        else if (ui.view === 'note' || ui.view === 'cnote') render();

      if (waits.length) Promise.all(waits).then(() => { imp.pending = false; if (backupLog.imp === imp) saveBackupLog('imp', imp); }); // 途中で別のファイルを読み込んでいたら、そちらの記録を消さない
    }catch(e){ alert('このファイルは読み込めませんでした。「書き出す」で作ったファイルを選んでください。'); }

}

  if (window.noteFlush) noteFlush();
  const okM = (!memosUnsaved || save('sm_memos', memos)) && (!atUnsaved || save('sm_memo_at', memoAt)); // 更新日は本文の後に
  const okB = window.boardRetry ? await boardRetry() : true;
  drawUnsaved();
  toast(okM && okB ? '保存しました' : '保存できませんでした。写真などを消して空き容量を増やしてから、もう一度押してください');
};
document.getElementById('navCoop').onclick = () => { if (window.noteFlush) noteFlush(); setUI({ view:'cnote' }); document.getElementById('main').scrollTop = 0; };
document.getElementById('navNote').onclick = () => { if (window.noteFlush) noteFlush(); setUI({ view:'note' }); document.getElementById('main').scrollTop = 0; };
document.getElementById('main').addEventListener('input', e => {
  if (e.target.id === 'wSearch'){ ui.wSearch = e.target.value; filterWeapons(); }
  if (e.target.id === 'memoSearch'){ ui.memoSearch = e.target.value; fillMemoSearch(); }
});
document.getElementById('navContest').onclick =() => { setMoreMenu(false); if (window.noteFlush) noteFlush(); autoOpened = false; setUI({ view:'contest' }); document.getElementById('main').scrollTop = 0; };
// 「その他」のメニュー: 押すと開き、もう一度押す・ほかの所を押す・選ぶと閉じる
// ---------- 初回だけの案内（2026-11-26、評価 F11・優先順位8）----------
// どのタブに何を書くかを3枚で。メモがまだ無い人に最初の1回だけ出す（「その他 → 使い方」でいつでも見られる）
const INTRO = [
  ['いまのステージ', '今の時間帯の<b>ステージ</b>と、そこに書いた<b>メモ</b>が出ます。試合の前にここを開けば、ぱっと確認できます。'],
  ['バトルメモ・サモランメモ', 'ステージ・ブキ・ルール（サモランは<b>潮位</b>）ごとにメモを書く場所です。大事なメモは「<b>☆ 試合前</b>」を押すと、画面の上と「いまのステージ」にまとまって出ます。'],
  ['メモ', '書いたメモを<b>全部まとめて探せます</b>。メモはこのスマホの中だけに保存されるので、機種変更の前は「メモ」の下の「バックアップ」で<b>書き出す</b>を押して、控えを取ってください。']
];
let introAt = 0;
function drawIntro(){
  const [h, t] = INTRO[introAt];
  document.getElementById('introP').textContent = '使い方 ' + (introAt + 1) + ' / ' + INTRO.length;
  document.getElementById('introH').textContent = h;
  document.getElementById('introT').innerHTML = t; // 中身は上の決まった文だけ
  document.getElementById('introBack').textContent = introAt ? '戻る' : 'とばす';
  document.getElementById('introNext').textContent = introAt === INTRO.length - 1 ? 'はじめる' : '次へ';
}
// 案内は一番上の画面: 戻る操作では案内だけを閉じる（自分の履歴を1つ積む）。出ている間は後ろを操作できないようにし（inert）、閉じたら元の所へフォーカスを戻す（Codexレビュー 2026-11-26）
let introSkipPop = false, introFrom = null;
const introOpen = () => !document.getElementById('intro').hidden;
const introBehind = on => [...document.body.children].forEach(el => { if (el.id !== 'intro' && el.tagName !== 'SCRIPT') el.inert = on; });
function openIntro(){
  introAt = 0; drawIntro(); introFrom = document.activeElement;
  document.getElementById('intro').hidden = false; introBehind(true);
  if (!(history.state && history.state.intro)) history.pushState({ intro:true }, '');
  document.getElementById('introNext').focus();
}
function closeIntro(fromPop){
  if (!introOpen()) return;
  document.getElementById('intro').hidden = true; introBehind(false); save('sm_intro', 1);
  if (!fromPop && history.state && history.state.intro){ introSkipPop = true; history.back(); } // この戻るで後ろの画面を閉じないように
  const f = introFrom && introFrom.isConnected && introFrom !== document.body ? introFrom : document.getElementById('navMore'); introFrom = null;
  if (f && f.focus) f.focus({ preventScroll: true });
}
document.getElementById('introNext').onclick = () => { if (introAt < INTRO.length - 1){ introAt++; drawIntro(); } else closeIntro(); };
document.getElementById('introBack').onclick = () => { if (introAt){ introAt--; drawIntro(); } else closeIntro(); };
document.getElementById('navHelp').onclick = () => { setMoreMenu(false); openIntro(); };
function setMoreMenu(open){
  document.getElementById('moreMenu').hidden = !open;
  document.getElementById('navMore').setAttribute('aria-expanded', open ? 'true' : 'false');
}
document.getElementById('navMore').onclick = e => { e.stopPropagation(); setMoreMenu(document.getElementById('moreMenu').hidden); };
// 外を押した時は閉じるだけ（後ろのステージなどを押したことにしない）。下のメニューのほかのボタンはそのまま効く
document.addEventListener('click', e => {
  if (document.getElementById('moreMenu').hidden || e.target.closest('#moreMenu, #navMore')) return;
  setMoreMenu(false);
  if (!e.target.closest('nav')){ e.preventDefault(); e.stopPropagation(); }
}, true);
document.getElementById('reload').onclick = () => refresh(true);
// 画面の「戻る」ボタンは履歴を1つ戻すだけにして、閉じる処理は popstate にまとめる（二重に閉じないため）
document.getElementById('edBack').onclick = () => { if (history.state && history.state.editor) history.back(); else closeEditor(false); };
document.getElementById('playBack').onclick = () => { if (history.state && history.state.play) history.back(); else closePlay(false); };
// 戻る操作は一番上に開いている画面だけを閉じる（作戦メモ編集 → WAVE閲覧 の順）
// 画像を見る画面（notePop）はメモの編集画面の上にも開くので、先に閉じる
window.addEventListener('popstate', () => { if (introSkipPop){ introSkipPop = false; return; } if (introOpen()){ closeIntro(true); return; } if (window.notePop && notePop()) {} else if (ed) closeEditor(true); else if (window.boardPop && boardPop()) {} else if (window.tierPop && tierPop()) {} else if (play) closePlay(true); });
document.getElementById('memoText').addEventListener('input', () => {
  document.getElementById('edSaved').textContent = '入力中…';
  clearTimeout(saveTimer); saveTimer = setTimeout(saveMemo, 500);
});
// アプリに戻ってきたとき：時間帯が変わっていれば取り直し、そうでなくても表示時刻を更新
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible'){ if (stale()) refresh(); else render(); }
  else if (ed){ clearTimeout(saveTimer); saveMemo(); }
  if (document.visibilityState !== 'visible' && memosUnsaved) save('sm_memos', memos);
  if (document.visibilityState !== 'visible' && atUnsaved && !memosUnsaved) save('sm_memo_at', memoAt); // 隠れる前にもう一度だけ試す
});
// 開きっぱなしでも時間帯の切り替わりに追従
setInterval(() => { if (document.visibilityState === 'visible' && !ed && stale()) refresh(); }, 60e3);
// 時間帯の切り替わりちょうどに描き直す（前は最大1分古いままだった。評価 D8 2026-11-25）。
// 手元のスケジュールには次の時間帯も入っているので、取り直しを待たずにその場で次に切り替わる。
// メモ帳で書いている途中は描き直さず（打ちかけを守る）、切り替わったことだけ知らせる。書き終えると切り替わる
var slotTimer = 0; // var: 宣言より前に render が呼ばれても止まらないように
function nextBoundary(){
  if (!sched || !sched.data) return 0;
  const d = sched.data, c = d.coopGroupingSchedule || {}, now = Date.now(); let t = Infinity;
  const see = n => { if (!n) return; [n.startTime, n.endTime].forEach(x => { const v = new Date(x).getTime(); if (v > now && v < t) t = v; }); };
  ['regularSchedules','bankaraSchedules','xSchedules','festSchedules'].forEach(k => ((d[k] || {}).nodes || []).forEach(see));
  ((d.eventSchedules || {}).nodes || []).forEach(ev => (ev.timePeriods || []).forEach(see));
  ['regularSchedules','bigRunSchedules','teamContestSchedules'].forEach(k => ((c[k] || {}).nodes || []).forEach(see));
  return t === Infinity ? 0 : t;
}
function armSlotTimer(){
  clearTimeout(slotTimer);
  const t = nextBoundary(); if (!t) return;
  slotTimer = setTimeout(() => {
    if (document.visibilityState === 'visible'){
      const noteV = ui.view === 'note' || ui.view === 'cnote';
      if (noteV && window.noteBusy && noteBusy()) toast('時間帯が変わりました。書き終えると今のステージに切り替わります');
      render();
      if (stale()) refresh();
    }
    armSlotTimer();
  }, Math.min(t - Date.now() + 1000, 6 * 3600e3)); // 境目の1秒後（端末の時計のずれを少し見込む）。長すぎる待ちは区切って測り直す
}

render();
refresh();
if (!load('sm_intro', 0) && !Object.keys(memos).some(k => memoOf(k))) openIntro(); // 初めての人だけ（もう書いている人には出さない）
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
