<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ステージメモ</title>
<meta name="theme-color" content="#16141f">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- black-translucent は使わない。iOS 26 では「black-translucent + viewport-fit=cover」でアプリの表示領域がステータスバー1本分だけ
     下で足りなくなり（WebKit bug 301108、メニューの下に謎の空き）、ステータスバー下のぼかしで上部の文字も薄く見える。
     この設定はホーム画面に追加した時にしか読まれないので、変えたらアイコンを削除して追加し直す必要がある -->
<script>window.APP_VERSION = '2026-11-12d';</script>
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="ステージメモ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#16141f; --card:#221f2e; --card2:#2b2739; --line:#3a3550;
  --text:#f2f0f7; --sub:#a9a3bd; --faint:#6f6987;
  --salmon:#ff6a1f; --regular:#3ddc3d; --bankara:#ff5a2b; --x:#14d6a0; --event:#ff4f9a; --fest:#e7d43a;
  --accent:#ff6a1f;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* html は下メニューと同じ色。iOSがアプリの外側に塗る帯が出てもメニューの続きに見えるように */
html{background:#100e18}
html,body{margin:0;color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  font-size:16px;line-height:1.5}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
/* 画面全体を「上: ヘッダー / 中: スクロール領域 / 下: メニュー」の固定レイアウトにする。
   メニューを position:fixed で下に貼る方式は、ホーム画面アプリでメニューの下に謎の空きが出たため（WAVE画面と同じ方式に統一） */
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg)}
header{flex:none;z-index:5;background:var(--bg);
  padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:10px}
.hrow h1{font-size:18px;margin:0;flex:1}
.reload{background:var(--card2);border-radius:999px;padding:6px 12px;font-size:13px}
.status{font-size:12px;color:var(--sub);margin-top:2px}
.status.err{color:#ff8a8a}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px max(16px, calc((100% - 640px) / 2)) 24px}
.seg{display:flex;background:var(--card);border-radius:12px;padding:4px;margin-bottom:14px}
.seg button{flex:1;padding:10px 4px;border-radius:9px;font-weight:700;color:var(--sub)}
.seg button.on{background:var(--card2);color:var(--text);box-shadow:0 1px 0 rgba(255,255,255,.06) inset}
.seg button.on.salmon{color:var(--salmon)}
.card{background:var(--card);border-radius:16px;margin-bottom:14px;overflow:hidden;border-left:5px solid var(--c,var(--accent))}
.chead{display:flex;align-items:baseline;gap:8px;padding:12px 14px 4px;flex-wrap:wrap}
.mode{font-weight:800;color:var(--c,var(--accent));font-size:15px}
.rule{font-weight:800;font-size:17px}
.time{margin-left:auto;font-size:12px;color:var(--sub)}
.extra{padding:0 14px 6px;font-size:13px;color:var(--sub)}
.weapons{display:flex;gap:6px;padding:2px 14px 8px}
.weapons img{width:40px;height:40px;background:var(--card2);border-radius:10px;padding:3px}
.stage{display:block;width:100%;text-align:left;padding:10px 14px 12px;border-top:1px solid var(--line)}
.stage:active{background:var(--card2)}
.shead{display:flex;align-items:center;gap:10px}
.shead img{width:72px;height:40px;object-fit:cover;border-radius:8px;background:var(--card2);flex:none}
.sname{font-weight:700;font-size:16px;flex:1}
.editbtn{font-size:12px;color:var(--sub);border:1px solid var(--line);border-radius:999px;padding:3px 10px;flex:none}
.memo{margin-top:8px;background:var(--card2);border-radius:10px;padding:8px 10px;white-space:pre-wrap;word-break:break-word;font-size:15px}
.memo .lbl{display:inline-block;font-size:11px;font-weight:700;color:var(--bg);background:var(--sub);border-radius:5px;padding:0 6px;margin-bottom:3px}
.memo .lbl.rule{background:var(--c,var(--accent))}
.memo + .memo{margin-top:6px}
.nomemo{margin-top:6px;font-size:13px;color:var(--faint)}
.nextbtn{width:100%;padding:12px;border:1px dashed var(--line);border-radius:12px;color:var(--sub);font-size:14px;margin-bottom:14px}
.nexthead{font-size:13px;color:var(--sub);margin:4px 2px 8px;font-weight:700}
.empty{color:var(--sub);text-align:center;padding:32px 8px}
.list .row{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:var(--card);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.list .row img{width:64px;height:36px;object-fit:cover;border-radius:7px;background:var(--card2);flex:none}
.list .rinfo{flex:1;min-width:0}
.list .rname{font-weight:700}
.list .rprev{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .rprev.none{color:var(--faint)}
.count{font-size:12px;color:var(--salmon);font-weight:700;flex:none}
.sec{font-size:13px;color:var(--sub);font-weight:700;margin:18px 2px 8px}
.backup{background:var(--card);border-radius:12px;padding:12px;font-size:14px;color:var(--sub)}
.backup .btns{display:flex;gap:8px;margin-top:10px}
.backup button,.backup label{flex:1;text-align:center;background:var(--card2);border-radius:10px;padding:10px;color:var(--text);font-weight:700;font-size:14px;cursor:pointer}
nav{flex:none;z-index:6;display:flex;background:#100e18;border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:10px 0 12px;font-size:12px;color:var(--faint);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button .ic{font-size:22px;line-height:1}
nav button.on{color:var(--text)}
/* editor */
#editor{position:fixed;inset:0;z-index:20;background:var(--bg);display:none;flex-direction:column}
#editor.open{display:flex}
.ehead{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;border-bottom:1px solid var(--line)}
.back{padding:8px 10px;font-weight:700;color:var(--accent)}
.etitle{flex:1;font-weight:800;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.saved{font-size:12px;color:var(--sub);min-width:84px;text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px 4px;max-height:30vh;overflow-y:auto;flex:none}
.chip{flex:none;padding:7px 12px;border-radius:999px;background:var(--card);color:var(--sub);font-weight:700;font-size:14px;position:relative}
.chip.on{background:var(--accent);color:#1a1020}
.chip.has::after{content:"";position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--salmon)}
.chip.on.has::after{background:#fff}
.ehint{font-size:12px;color:var(--faint);padding:4px 14px 0}
#memoText{flex:1;margin:8px 12px calc(12px + env(safe-area-inset-bottom));padding:12px;border-radius:12px;border:1px solid var(--line);
  background:var(--card);color:var(--text);font:inherit;font-size:16px;resize:none;outline:none}
#memoText:focus{border-color:var(--accent)}
/* ばちこん */
.ccard{background:var(--card);border-radius:16px;margin-bottom:14px;overflow:hidden;border-left:5px solid var(--salmon)}
.ccard .shead{padding:10px 14px}
.badge{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;margin:0 14px 8px}
.badge.has{background:var(--salmon);color:#1a1020}
.badge.new{background:var(--card2);color:var(--sub)}
.openbtn{display:block;width:calc(100% - 28px);margin:0 14px 14px;padding:13px;border-radius:12px;background:var(--salmon);color:#1a1020;font-weight:800;text-align:center;font-size:16px}
.srcnote{font-size:11px;color:var(--faint);margin:14px 2px}
.srcnote a,.plinks a{color:var(--sub)}
#play{position:fixed;inset:0;z-index:20;background:var(--bg);display:none;flex-direction:column}
#play.open{display:flex}
#playBody{flex:1;overflow-y:auto;padding:12px 14px 20px;-webkit-overflow-scrolling:touch}
#waveBar{display:flex;gap:6px;padding:8px 10px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#100e18}
#waveBar button{flex:1;min-height:56px;border-radius:12px;background:var(--card);color:var(--sub);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:4px 2px}
#waveBar button b{font-size:18px}
#waveBar button small{font-size:10px;line-height:1.15;text-align:center}
#waveBar button.on{background:var(--salmon);color:#1a1020;outline:2px solid #fff}
.pw{margin-bottom:12px}
.pwn{font-size:30px;font-weight:900;line-height:1.1}
.pwc{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap}
.tide{font-size:20px;font-weight:800;border-radius:8px;padding:2px 10px}
.tLow{background:#d9b26a;color:#2a1d05}.tMid{background:#8f8aa6;color:#14121c}.tHigh{background:#3d8bff;color:#04122b}
.pev{font-size:20px;font-weight:800;color:var(--event)}
.pday{font-size:18px;color:var(--sub);font-weight:700}
.pws{font-size:13px;color:var(--sub);margin-top:6px}
.pmemo{background:#2d2316;border:1px solid #6b4a1f;border-radius:14px;padding:10px 12px;margin-bottom:12px}
.pml{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:800;color:var(--salmon)}
.pml button{border:1px solid #6b4a1f;border-radius:999px;padding:6px 14px;font-size:13px;color:var(--text);min-height:36px}
.pmt{white-space:pre-wrap;word-break:break-word;font-size:18px;margin-top:4px}
.pmt.none{font-size:13px;color:var(--faint)}
.psec{background:var(--card);border-radius:14px;padding:10px 12px;margin-bottom:12px}
.psh{font-size:13px;font-weight:800;color:var(--sub);margin-bottom:6px}
.capn{font-size:12px;color:var(--sub);margin:4px 0 6px}
.cond{display:inline-block;background:#ff4d4d;color:#fff;font-size:12px;font-weight:800;border-radius:6px;padding:1px 7px;margin:2px 4px 2px 0}
.olist{margin:0;padding-left:1.6em}
.olist li{padding:3px 0;border-bottom:1px solid var(--line)}
.olist.big li{font-size:17px;font-weight:700}
.tg{display:grid;grid-template-columns:50px 1fr;column-gap:8px;border-top:1px solid var(--line);padding:6px 0}
.tg.late{opacity:.6}
.tgt{display:flex;flex-direction:column;align-items:center;line-height:1.05}
.tgt b{font-size:22px;color:var(--text)}
.tgt small{font-size:10px;color:var(--faint)}
.tgt small:last-child{color:var(--sub)}
.tr{padding:2px 0 3px;font-size:16px}
.tr .dir{display:inline-block;background:var(--card2);border:1px solid var(--line);border-radius:6px;padding:0 7px;margin-right:6px;font-size:14px;font-weight:700}
.tr .who{font-weight:800;margin-right:6px}
.tr .det{font-size:13px;color:var(--sub);margin-right:6px}
.tr .note{font-size:12px;color:var(--sub);margin-top:2px}
.nodata{font-size:14px;color:var(--faint);padding:6px 0}
.tl2{width:100%;text-align:left;min-height:52px}
.tl2:active{background:var(--card2)}
.mynote{font-size:17px;font-weight:800;white-space:pre-wrap;word-break:break-word;color:#ffd7b8;padding:2px 0}
.addnote{font-size:13px;color:var(--faint);padding-top:10px}
.tl2.late .addnote{display:none}
.tr.wk{font-size:14px;color:var(--sub)}
.tr.wk .who{color:var(--text);font-weight:700}
.tr .src{font-size:10px;color:var(--faint);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:4px}
.wspb{border:2px solid transparent;text-align:left;color:var(--text)}
.wspb.on{border-color:var(--salmon)}
.wspb em{font-style:normal;font-size:10px;color:var(--salmon)}
.sppick{background:var(--card2);border:1px solid var(--salmon);border-radius:12px;padding:10px;margin-top:10px}
.spgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.spgrid button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;border-radius:10px;background:var(--card);font-size:11px;line-height:1.2;color:var(--sub);min-height:44px}
.spgrid button img{width:44px;height:44px;background:#0b0a12;border-radius:10px;padding:4px}
.spgrid button.on{background:var(--salmon);color:#1a1020}
.fact{font-size:14px;padding:3px 0}
.fact span{display:inline-block;min-width:9em;color:var(--sub);font-size:12px}
.plinks{display:flex;gap:8px;margin-bottom:12px}
.plinks a{flex:1;text-align:center;padding:12px 6px;border-radius:12px;background:var(--card);border:1px solid var(--line);text-decoration:none;font-weight:700;font-size:14px;color:var(--text)}
.wsp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wspb{display:grid;grid-template-columns:40px 1fr;gap:2px 8px;align-items:center;background:var(--card2);border-radius:12px;padding:8px}
.wspb .wname{grid-column:1 / span 2;font-size:13px;font-weight:700}
.wspb .spi{width:40px;height:40px;background:#0b0a12;border-radius:10px;padding:4px}
.wspb .spn{font-size:12px;color:var(--sub)}
.restart{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);color:var(--sub);font-size:14px;margin-bottom:8px}
#editor{z-index:30}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#000c;color:#fff;
  padding:8px 14px;border-radius:999px;font-size:13px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<div id="app">
<header>
  <div class="hrow"><h1>ステージメモ</h1><button class="reload" id="reload">↻ 更新</button></div>
  <div class="status" id="status">読み込み中…</div>
</header>
<main id="main"></main>
<nav>
  <button id="navNow" class="on"><span class="ic">⏱</span>いまのステージ</button>
  <button id="navContest"><span class="ic">🐟</span>ばちこん</button>
  <button id="navList"><span class="ic">📝</span>メモ一覧</button>
</nav>
</div>
<div id="play">
  <div class="ehead">
    <button class="back" id="playBack">‹ 一覧</button>
    <div class="etitle" id="playTitle"></div>
  </div>
  <div id="playBody"></div>
  <div id="waveBar"></div>
</div>
<div id="editor">
  <div class="ehead">
    <button class="back" id="edBack">‹ 戻る</button>
    <div class="etitle" id="edTitle"></div>
    <div class="saved" id="edSaved"></div>
  </div>
  <div class="chips" id="edChips"></div>
  <div class="ehint" id="edHint"></div>
  <textarea id="memoText" placeholder="ここにメモを書く（自動で保存されます）"></textarea>
</div>
<div class="toast" id="toast"></div>
<script src="contest-data.js"></script>
<script>
'use strict';
const API = 'https://splatoon3.ink/data/schedules.json';
const LOC = 'https://splatoon3.ink/data/locale/ja-JP.json';

// ルールID（splatoon3.inkのID）
const RULES = [
  ['VnNSdWxlLTA=', 'ナワバリ'],
  ['VnNSdWxlLTE=', 'エリア'],
  ['VnNSdWxlLTI=', 'ヤグラ'],
  ['VnNSdWxlLTM=', 'ホコ'],
  ['VnNSdWxlLTQ=', 'アサリ'],
];
const RULE_NAME = Object.fromEntries(RULES);

// 通信できない初回でも一覧を出せるよう、ステージ名の控えを持っておく（取得できたら上書き）
const FALLBACK_STAGES = {"VnNTdGFnZS0x":"ユノハナ大渓谷","VnNTdGFnZS0y":"ゴンズイ地区","VnNTdGFnZS0z":"ヤガラ市場","VnNTdGFnZS00":"マテガイ放水路","VnNTdGFnZS01":"ナンプラー遺跡","VnNTdGFnZS02":"ナメロウ金属","VnNTdGFnZS03":"クサヤ温泉","VnNTdGFnZS04":"タラポートショッピングパーク","VnNTdGFnZS05":"ヒラメが丘団地","VnNTdGFnZS0xMA==":"マサバ海峡大橋","VnNTdGFnZS0xMQ==":"キンメダイ美術館","VnNTdGFnZS0xMg==":"マヒマヒリゾート＆スパ","VnNTdGFnZS0xMw==":"海女美術大学","VnNTdGFnZS0xNA==":"チョウザメ造船","VnNTdGFnZS0xNQ==":"ザトウマーケット","VnNTdGFnZS0xNg==":"スメーシーワールド","VnNTdGFnZS0xNw==":"コンブトラック","VnNTdGFnZS0xOA==":"マンタマリア号","VnNTdGFnZS0xOQ==":"タカアシ経済特区","VnNTdGFnZS0yMA==":"オヒョウ海運","VnNTdGFnZS0yMQ==":"バイガイ亭","VnNTdGFnZS0yMg==":"ネギトロ炭鉱","VnNTdGFnZS0yMw==":"カジキ空港","VnNTdGFnZS0yNA==":"リュウグウターミナル","VnNTdGFnZS0yNg==":"デカライン高架下","Q29vcFN0YWdlLTY=":"難破船ドン・ブラコ","Q29vcFN0YWdlLTE=":"シェケナダム","Q29vcFN0YWdlLTI=":"アラマキ砦","Q29vcFN0YWdlLTc=":"ムニ・エール海洋発電所","Q29vcFN0YWdlLTQ=":"トキシラズいぶし工房","Q29vcFN0YWdlLTg=":"すじこジャンクション跡","Q29vcFN0YWdlLTk=":"どんぴこ闘技場","Q29vcFN0YWdlLTEwMA==":"スメーシーワールド","Q29vcFN0YWdlLTEwMg==":"海女美術大学","Q29vcFN0YWdlLTEwMw==":"マテガイ放水路","Q29vcFN0YWdlLTEwNA==":"ナンプラー遺跡","Q29vcFN0YWdlLTEwNQ==":"タラポートショッピングパーク","Q29vcFN0YWdlLTEwNg==":"ゴンズイ地区"};

// ---------- 保存 ----------
function load(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }
function save(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } }

let memos = load('sm_memos', {});           // { key: text }
if (!memos || typeof memos !== 'object' || Array.isArray(memos)) memos = {};
let sched = load('sm_sched', null);         // { data, fetchedAt }
let loc = load('sm_locale', null);          // ja-JP locale
// サモラン会場は全ステージ一覧がAPIに無いので、画像URLを持っておく。
// 画像名は内部名（Cop_xxx）のSHA256。ビッグランは Cop_<バトルステージの内部名>
const COOP_IMG_HASH = {
  'Q29vcFN0YWdlLTE=':'be584c7c7f547b8cbac318617f646680541f88071bc71db73cd461eb3ea6326e',      // シェケナダム Cop_Shakeup
  'Q29vcFN0YWdlLTI=':'3418d2d89ef84288c78915b9acb63b4ad48df7bfcb48c27d6597920787e147ec',      // アラマキ砦 Cop_Shakespiral
  'Q29vcFN0YWdlLTQ=':'630d89698e3e260ef12cb2a32e1cb2c4c83c0e58fc882762da1fa2cea19a5260',      // トキシラズ Cop_Shakelift
  'Q29vcFN0YWdlLTY=':'1a29476c1ab5fdbc813e2df99cd290ce56dfe29755b97f671a7250e5f77f4961',      // ドン・ブラコ Cop_Shakeship
  'Q29vcFN0YWdlLTc=':'f1e4df4cff1dc5e0acc66a9654fecf949224f7e4f6bd36305d4600ac3fa3db7b',      // ムニ・エール Cop_Shakedent
  'Q29vcFN0YWdlLTg=':'0e05d4caa34089a447535708370286f4ee6068661359b4d7cf6c319863424f84',      // すじこ Cop_Shakehighway
  'Q29vcFN0YWdlLTk=':'5f09625c9031652ca1edcf8028265b03ecc28475ab3d56910960a68430d7948a',      // どんぴこ Cop_Shakerail

  'Q29vcFN0YWdlLTEwMg==':'3598b7f54248b84c47cde6b99aa45ff296a41d3d5f38eaccfe2327b2874fff0b',  // 海女美 Cop_Upland

// ---------- 時刻 ----------
const WD = ['日','月','火','水','木','金','土'];
function hm(d){ return d.getHours() + ':' + String(d.getMinutes()).padStart(2,'0'); }
function sameDay(a,b){ return a.toDateString() === b.toDateString(); }
function fmtRange(s, e, now){
  s = new Date(s); e = new Date(e);
  if (sameDay(s,e) && sameDay(s,now)) return hm(s) + '〜' + hm(e);
  const md = d => (d.getMonth()+1) + '/' + d.getDate() + '(' + WD[d.getDay()] + ') ';
  return md(s) + hm(s) + '〜' + (sameDay(s,e) ? '' : md(e)) + hm(e);
}
function inRange(n, now){ return new Date(n.startTime) <= now && now < new Date(n.endTime); }
function curAndNext(nodes, now){
  nodes = (nodes || []).filter(n => new Date(n.endTime) > now);
  const cur = nodes.find(n => inRange(n, now)) || null;
  const next = nodes.find(n => new Date(n.startTime) >= (cur ? new Date(cur.endTime) : now)) || null;
  return { cur, next };
}

// ---------- 取得 ----------
async function fetchJSON(url){
  const r = await fetch(url, { cache:'no-store' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
async function refresh(force){
  if (loading) return;
  loading = true; setStatus('最新のスケジュールを取得中…');
  try{
    const tasks = [fetchJSON(API)];
    const needLoc = force || !loc || !loc._at || (Date.now() - loc._at > 3*24*3600e3);
    if (needLoc) tasks.push(fetchJSON(LOC).catch(() => null));
    const [s, l] = await Promise.all(tasks);
    sched = { data: s.data, fetchedAt: Date.now() };
    save('sm_sched', sched);
    if (l){ l._at = Date.now(); loc = l; save('sm_locale', { _at:l._at, stages:l.stages, rules:l.rules, bosses:l.bosses, weapons:l.weapons, events:l.events }); }
    rememberStageImages();
    fetchError = false;
  }catch(e){
    fetchError = true;
  }
  loading = false;
  render();
}
function rememberStageImages(){
  if (!sched) return;
  const d = sched.data;
  // 全バトルステージの一覧（vsStages）は高解像度の originalImage だけを持つので、同じ画像の小さい版のURLに置き換える
  const small = u => u.replace('/high_resolution/', '/low_resolution/').replace(/_0\.png$/, '_1.png');
  (d.vsStages && d.vsStages.nodes || []).forEach(s => { if (s && s.id && s.originalImage && s.originalImage.url) stageImg[s.id] = small(s.originalImage.url); });
  const put = s => { if (s && s.id && s.image && s.image.url) stageImg[s.id] = s.image.url; };
  ['regularSchedules','bankaraSchedules','xSchedules','festSchedules'].forEach(k => ((d[k]||{}).nodes||[]).forEach(n => {
    Object.values(n).forEach(v => [].concat(v || []).forEach(st => st && st.vsStages && st.vsStages.forEach(put)));
  }));
  const coop = d.coopGroupingSchedule || {};
  ['regularSchedules','bigRunSchedules','teamContestSchedules'].forEach(k => ((coop[k]||{}).nodes||[]).forEach(n => {
    const st = n.setting && n.setting.coopStage;
    if (st) stageImg[st.id] = (st.thumbnailImage && st.thumbnailImage.url) || (st.image && st.image.url);
  }));
  save('sm_stageimg', stageImg);
}
// 時間帯が切り替わっていたら取り直す（ホーム画面アプリは開きっぱなしで復帰することがあるため）
function stale(){
  if (!sched) return true;
  const now = Date.now();
  if (now - sched.fetchedAt > 30*60e3) return true;
  // 取得したあとに新しい時間帯が始まっていたら取り直す
  const d = sched.data, c = d.coopGroupingSchedule || {};
  const nodes = [].concat((d.bankaraSchedules||{}).nodes || [], (c.regularSchedules||{}).nodes || []);
  return nodes.some(n => { const s = new Date(n.startTime).getTime(); return s > sched.fetchedAt && s <= now; });
}

function setStatus(t, err){
  const el = document.getElementById('status');
  el.textContent = t; el.className = 'status' + (err ? ' err' : '');
}
function statusText(){
  if (loading) return;
  if (!sched){ setStatus(fetchError ? 'スケジュールを取得できませんでした。通信を確認して「更新」を押してください' : '読み込み中…', fetchError); return; }
  const t = new Date(sched.fetchedAt);
  const base = (sameDay(t,new Date()) ? '' : (t.getMonth()+1)+'/'+t.getDate()+' ') + hm(t) + ' 時点のスケジュール';
  if (fetchError) setStatus('通信できなかったので、' + base + 'を表示中', true);
  else setStatus(base);
}

function allStages(kind){
  const names = Object.assign({}, FALLBACK_STAGES, loc && loc.stages ? Object.fromEntries(Object.entries(loc.stages).map(([k,v]) => [k, v.name])) : {});
  const pre = kind === 'coop' ? 'CoopStage-' : 'VsStage-';
  const out = [];
  for (const id of Object.keys(names)){
    let dec = ''; try{ dec = atob(id); }catch(e){}
    if (!dec.startsWith(pre)) continue;
    const num = parseInt(dec.slice(pre.length), 10);
    if (!(num > 0)) continue; // 「各地で同時発生」などは除外
    out.push({ id, num, name: names[id] + (kind === 'coop' && num >= 100 ? '（ビッグラン）' : '') });
  }
  return out.sort((a,b) => a.num - b.num);
}
function renderList(){
  const kind = ui.listSub === 'salmon' ? 'coop' : 'vs';

    '<button data-lsub="battle" class="' + (kind==='vs'?'on':'') + '">バトル</button></div><div class="list">';
  for (const s of allStages(kind)){
    let prev = '', cnt = 0;
    if (kind === 'coop'){ prev = memoOf(kCoop(s.id)); cnt = prev ? 1 : 0; }
    else {
      const keys = [kVs(s.id)].concat(RULES.map(r => kVs(s.id, r[0])));
      const filled = keys.filter(k => memoOf(k));
      cnt = filled.length; prev = filled.length ? memoOf(filled[0]) : '';

    h += '<button class="row" data-edit="' + kind + '" data-id="' + esc(s.id) + '" data-rule="">' +

      esc(prev ? prev.split('\n')[0] : 'メモなし') + '</div></div>' +
      (kind === 'vs' && cnt ? '<span class="count">' + cnt + '件</span>' : '') + '</button>';

  return h;
}

// 全角・半角の違い（wikiの「R-PEN／5H」とAPIの「R-PEN/5H」など）を吸収して比べる
const nfkc = s => String(s || '').normalize('NFKC');
// 公開スケジュールの回（ステージ＋ブキ）が、どのシナリオの復刻かを判定する。ブキ3つ以上一致で採用
function matchByNames(stageId, names){
  names = names.map(nfkc);
  // シナリオごとに一番よく一致した開催回を集め、別シナリオが同点なら「判定できない」にする
  const bySc = {};
  CD.instances.forEach(x => {
    if (x.stage !== stageId) return;
    const s = (x.weapons || []).filter(w => names.includes(nfkc(w.name))).length;
    const cur = bySc[x.scenario];
    if (!cur || s > cur.s || (s === cur.s && x.no > cur.x.no)) bySc[x.scenario] = { x, s };
  });
  const ranked = Object.values(bySc).sort((a, b) => b.s - a.s);
  if (!ranked.length || ranked[0].s < 3) return null;
  if (ranked[1] && ranked[1].s === ranked[0].s) return null;
  return ranked[0].x;
}

let play = null; // { sid, no, start, wave }
let autoOpened = false;

function setWave(i){ play.wave = i; spPick = null; save('sm_play', play); drawPlay(true); }

const firstNum = t => { const m = String(t).match(/\d+(\.\d+)?/); return m ? parseFloat(m[0]) : NaN; };
const COND_RE = /キケン度[^、。/()（）]*?\d+%[^、。/()（）]*/g;
function condBadges(text){
  const m = String(text).match(COND_RE);
  return m ? m.map(c => '<span class="cond">' + esc(c) + '</span>').join('') : '';
}
function colIdx(head, re){ return head.findIndex(x => re.test(x)); }
// オオモノの湧き時刻（＝湧く方向が変わる時刻）。間隔は 72/n 秒で、キケン度の帯で決まる（wiki「サーモンラン NEXT WAVE」）
// [キケン度の下限, n]。丸めた間隔を足し続けると誤差で28秒が27.9秒になるので、毎回 100 - i*72/n で計算する
const SPAWN_BANDS = [[333, 9], [266.6, 8], [200, 7], [150, 6], [100, 5], [60, 4], [20, 3], [0, 2]];
function spawnN(danger){ const d = parseFloat(danger); return (SPAWN_BANDS.find(([min]) => d >= min) || [0, 4])[1]; }
function spawnInterval(danger){ return Math.round(72 / spawnN(danger) * 10) / 10; }
function spawnTimes(danger){
  const n = spawnN(danger), out = [];
  for (let i = 0; 100 - i * 72 / n > 0.5; i++) out.push(Math.round((100 - i * 72 / n) * 10) / 10);
  return out;
}
const fmtT = t => String(Math.round(t * 10) / 10);
const ctKey = (sid, wave, t) => 'ct:' + sid + ':' + wave + ':' + fmtT(t);
// 湧き時刻の行に、wikiの表の行（±1秒以内なら同じ行）と、自分で足した時刻のメモを集める
function buildTimeline(sid, n, danger, timeTables){
  const times = spawnTimes(danger), rows = new Map();
  // exact=true（自分のメモの時刻）は寄せずにその秒の行を作る。メモのキーと行の秒を一致させるため
  const slot = (t, exact) => { const near = exact ? null : times.find(x => Math.abs(x - t) <= 1); const k = fmtT(near != null ? near : t);
    if (!rows.has(k)) rows.set(k, { t: parseFloat(k), wiki: [] }); return rows.get(k); };
  times.forEach(t => slot(t, true));
  timeTables.forEach(b => {
    const H = b.head, it = colIdx(H, /^タイム$/), idir = colIdx(H, /^方角$/), idir2 = colIdx(H, /^方角\(詳細\)$/),
      iwho = colIdx(H, /オオモノ|ブキ名/), idet = colIdx(H, /^詳細/), inote = colIdx(H, /備考/);
    const used = new Set([it, idir, idir2, iwho, idet, inote].filter(x => x >= 0));
    b.rows.forEach(r => {
      const t = firstNum(r[it]); if (isNaN(t)) return;
      const extra = r.map((v, k) => used.has(k) || !v ? '' : (H[k] || '') + ': ' + v).filter(Boolean).join(' / ');
      slot(t).wiki.push({ dir: [idir >= 0 ? r[idir] : '', idir2 >= 0 ? r[idir2] : ''].filter(Boolean).join(' '),
        who: iwho >= 0 ? r[iwho] : '', det: idet >= 0 ? r[idet] : '', note: [inote >= 0 ? r[inote] : '', extra].filter(Boolean).join(' / ') });
    });
  });
  const p = 'ct:' + sid + ':' + n + ':';
  Object.keys(memos).forEach(k => { if (k.startsWith(p) && memoOf(k)) { const t = parseFloat(k.slice(p.length)); if (!isNaN(t)) slot(t, true); } });
  return [...rows.values()].sort((a, b) => b.t - a.t);
}
// 時刻の無い表（ドロシャケのカンケツセン順など）
function plainTable(b){
  return '<ol class="olist">' + b.rows.map(r => '<li>' + esc(r.map((v, k) => v ? (b.head[k] && r.length > 1 ? b.head[k] + ': ' : '') + v : '').filter(Boolean).join(' ／ ')) + condBadges(r.join(' ')) + '</li>').join('') + '</ol>';
}
function listTitle(w){
  if (w.event === 'グリル発進') return 'グリルに狙われる順（ブキ）';
  if (w.event === 'キンシャケ探し') return 'キンシャケが出るカンケツセンの順（移動経路）';
  return '順番';
}
function capNote(cap){
  if (!cap) return '';
  const m = cap.match(/キケン度\s*(\d+%)/);
  return '<div class="capn">' + (m ? '<span class="cond">キケン度' + m[1] + 'のときの表</span> 他のキケン度では数や種類が違うことがあります' : esc(cap)) + '</div>';
}

function drawPlay(toTop){
  const s = play && scenById(play.sid), w = s && s.waves[play.wave], n = play ? play.wave + 1 : 0;
  if (!w) return;
  w.blocks = w.blocks || []; w.facts = w.facts || [];
  const inst = CD.instances.find(x => x.no === play.no) || latestInst(play.sid) || { no: '?', weapons: [] };
  document.getElementById('playTitle').textContent = nameById(s.stage) + '（' + scenTitle(s.id) + '）';
  const memo = memoOf(cmKey(s.id, n));
  const tables = w.blocks.filter(b => b.type === 'table');
  const timeTables = tables.filter(b => colIdx(b.head, /^タイム$/) >= 0);
  const otherTables = tables.filter(b => colIdx(b.head, /^タイム$/) < 0);
  const lists = w.blocks.filter(b => b.type === 'list');
  let h = '<div class="pw"><div class="pwn">WAVE ' + n + '</div><div class="pwc">' + tideTag(w.tide) + (w.event ? '<span class="pev">' + esc(w.event) + '</span>' : '<span class="pday">昼</span>') + '</div>' +
    '<div class="pws">キケン度 最大' + esc(w.danger) + '・ノルマ ' + esc(w.quota) + (w.max ? '・最大納品 ' + esc(w.max) : '') + '</div></div>';
  // 自分の作戦（最上部）
  h += '<div class="pmemo"><div class="pml"><span>自分の作戦</span><button data-cm-edit="1">✎ 編集</button></div>' +
    (memo ? '<div class="pmt">' + esc(memo) + '</div>' : '<div class="pmt none">まだありません。「編集」から書けます</div>') + '</div>';
  // イベントの主役（グリルの狙われ順・キンシャケの出現順など）
  lists.forEach(b => {
    h += '<div class="psec"><div class="psh">' + esc(listTitle(w)) + '</div>' + capNote(b.caption) + '<ol class="olist big">' + b.items.map(x => '<li>' + esc(x) + '</li>').join('') + '</ol></div>';
  });
  otherTables.forEach(b => { h += '<div class="psec"><div class="psh">' + esc(b.head.filter(Boolean).join('・')) + '</div>' + capNote(b.caption) + plainTable(b) + '</div>'; });
  // 湧きの時系列: キケン度から出した湧き時刻の行に、wikiの情報と自分のメモを重ねる。行をタップでメモを編集
  const iv = spawnInterval(w.danger);
  const tl = buildTimeline(s.id, n, w.danger, timeTables);
  const caps = timeTables.map(b => b.caption).filter(c => /キケン度/.test(c || ''));
  h += '<div class="psec"><div class="psh">湧きの時系列（残り秒）</div>' +
    '<div class="capn">キケン度' + esc(w.danger) + 'のときの湧き時刻（' + iv + '秒ごとに湧く方向が変わる）。<b>行をタップするとメモできます</b></div>' +
    caps.map(capNote).join('') +
    tl.map(row => {
      const late = row.t < 28, last = row.t === 28;
      const mine = memoOf(ctKey(s.id, n, row.t));
      return '<button class="tg tl2' + (late ? ' late' : '') + '" data-ct="' + row.t + '"><div class="tgt"><small>残り</small><b>' + esc(fmtT(row.t)) + '</b><small>' + (last ? '最後' : late ? 'ザコのみ' : '秒') + '</small></div><div class="tgb">' +
        (mine ? '<div class="mynote">' + esc(mine) + '</div>' : '') +
        row.wiki.map(x => '<div class="tr wk">' + (x.dir ? '<span class="dir">' + esc(x.dir) + '</span>' : '') + '<span class="who">' + esc(x.who || (x.dir ? '湧き方向' : '')) + '</span>' +
          (x.det ? '<span class="det">' + esc(x.det) + '</span>' : '') + condBadges(x.who + ' ' + x.note) + (x.note ? '<div class="note">' + esc(x.note) + '</div>' : '') + '<span class="src">wiki</span></div>').join('') +
        (mine || row.wiki.length ? '' : '<div class="addnote">＋ タップしてメモ</div>') + '</div></button>';
    }).join('') +
    '<button class="addrow" data-ct-add="1">＋ 秒数を指定してメモを追加</button>' +
    (s.detail ? '' : '<div class="capn">このシナリオはwikiに湧きの詳細がありません（潮位とイベントのみ判明）</div>') + '</div>';
  // 補足の項目（タマヒロイ方向など）
  if (w.facts.length) h += '<div class="psec"><div class="psh">そのほか</div>' + w.facts.map(([k, v]) => '<div class="fact"><span>' + esc(k) + '</span>' + esc(v) + '</div>').join('') + '</div>';
  // マップ・出典
  const internal = COOP_INTERNAL[s.stage], tk = TIDE_KEY[w.tide];
  h += '<div class="plinks">' + (internal && tk ? '<a href="https://salmon-learn-nw.gungee.jp/map/?stage=' + internal + '&tide=' + tk + '" target="_blank" rel="noopener">🗺 マップ（' + esc(w.tide) + '）</a>' : '') +
    (s.detail ? '<a href="' + esc(CD.source.wiki + '#c' + s.id) + '" target="_blank" rel="noopener">📖 wikiで解説を読む</a>' : '') + '</div>';
  // ブキとスペシャル
  // スペシャルは復刻で変わることがあるので、タップして自分で変えられる（memos['sp:シナリオ:ブキ番号']）
  h += '<div class="psec"><div class="psh">ブキとスペシャル（タップで変更。最初は第' + inst.no + '回の時点）</div><div class="wsp">' +
    inst.weapons.map((x, k) => {
      const mine = memoOf(spKey(s.id, k)), sp = SP[mine || x.sp];
      return '<button class="wspb' + (spPick === k ? ' on' : '') + '" data-spw="' + k + '"><span class="wname">' + esc(x.name) + '</span>' +
        (sp ? '<img class="spi" src="' + esc(sp.img) + '" alt=""><span class="spn">' + esc(sp.name) + (mine && mine !== x.sp ? '<br><em>自分で変更</em>' : '') + '</span>' : '<span class="spn">未設定</span>') + '</button>';
    }).join('') + '</div>' +
    (spPick != null && inst.weapons[spPick] ? '<div class="sppick"><div class="psh">' + esc(inst.weapons[spPick].name) + ' のスペシャルを選ぶ</div><div class="spgrid">' +
      SPECIALS.map(([k, nm]) => '<button data-sppick="' + k + '" class="' + ((memoOf(spKey(s.id, spPick)) || inst.weapons[spPick].sp) === k ? 'on' : '') + '"><img src="' + esc(SP[k].img) + '" alt=""><span>' + esc(nm) + '</span></button>').join('') +
      '</div><button class="restart" style="margin:8px 0 0" data-sppick="">第' + inst.no + '回の時点に戻す</button></div>' : '') + '</div>';
  h += '<button class="restart" data-restart="1">↺ 最初から（WAVE 1へ）</button>';
  const body = document.getElementById('playBody');
  body.innerHTML = h;
  if (toTop) body.scrollTop = 0;
  document.getElementById('waveBar').innerHTML = s.waves.map((x, i) =>
    '<button data-wave="' + i + '" class="' + (i === play.wave ? 'on' : '') + '"><b>W' + (i + 1) + '</b><small>' + esc(waveShort(x)) + '</small></button>').join('');
}
document.getElementById('play').addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t || !play) return;
  if (t.dataset.wave != null) setWave(+t.dataset.wave);
  else if (t.dataset.restart) setWave(0);
  else if (t.dataset.cmEdit) openEditor('cm', String(play.sid), String(play.wave + 1));
  else if (t.dataset.ct != null) openEditor('ct', String(play.sid), (play.wave + 1) + ':' + fmtT(parseFloat(t.dataset.ct)));
  else if (t.dataset.ctAdd){
    const raw = nfkc(prompt('残り何秒のメモを追加しますか？（1〜100、例: 55）') || '').trim().replace(/秒$/, '');
    if (!raw) return;
    const v = /^\d{1,3}(\.\d)?$/.test(raw) ? Number(raw) : NaN;
    if (!(v >= 1 && v <= 100)) { alert('1〜100の数字で入力してください（小数は1桁まで）'); return; }
    openEditor('ct', String(play.sid), (play.wave + 1) + ':' + fmtT(v));
  }
  else if (t.dataset.spw != null){ spPick = spPick === +t.dataset.spw ? null : +t.dataset.spw; drawPlay(false); }
  else if (t.dataset.sppick != null){
    const k = spKey(play.sid, spPick);
    const before = memos[k];
    if (t.dataset.sppick) memos[k] = t.dataset.sppick; else delete memos[k];
    if (!save('sm_memos', memos)){ if (before === undefined) delete memos[k]; else memos[k] = before; toast('保存できませんでした'); }
    spPick = null; drawPlay(false);
  }
});
// 開催中のばちこんがあれば、ばちこんタブを開いたときに直接シナリオを出す
function liveContest(){
  const n = contestNodes().find(x => inRange(x, new Date()));
  const m = n && matchContest(n);
  return m ? { node: n, inst: m } : null;
}
function maybeAutoOpen(){
  if (ui.view !== 'contest' || play || ed || autoOpened) return;
  const lc = liveContest();
  if (lc){ autoOpened = true; openPlay(lc.inst.scenario, lc.inst.no, lc.node.startTime); }
}
// 旧版で手入力したシナリオ記録を、作戦メモに一度だけ書き写す（元の記録は残す）
// 壊れた記録は1件ずつ飛ばし、内蔵データが読めて保存に成功した時だけ「移行済み」にする。バックアップ読み込み後にも呼ぶ
function migrateOldContests(force){
  if (!force && load('sm_contests_migrated', false)) return;
  if (!CD.scenarios.length || !CD.instances.length) return;
  Object.values(contests || {}).forEach(c => {
    try{
      if (!c || !Array.isArray(c.waves)) return;
      const x = matchByNames(c.stageId, Array.isArray(c.weapons) ? c.weapons.map(w => w && w.name) : []);
      if (!x) return;
      c.waves.forEach((w, i) => {
        if (!w) return;
        const lines = (Array.isArray(w.rows) ? w.rows : []).filter(r => r && (r.where || r.what)).map(r => '残り' + r.t + '秒 ' + [r.where, r.what].filter(Boolean).join(' '));
        if (typeof w.note === 'string' && w.note.trim()) lines.push(w.note.trim());
        if (typeof w.event === 'string' && w.event) lines.unshift('（前の記録）' + w.event);
        const k = cmKey(x.scenario, i + 1);
        if (lines.length && !memoOf(k)) memos[k] = lines.join('\n');
      });
    }catch(e){ /* この記録だけ飛ばす */ }
  });
  if (save('sm_memos', memos)) save('sm_contests_migrated', true);
}
migrateOldContests(false);
function setUI(p){ Object.assign(ui, p); save('sm_ui', { view:ui.view, nowSub:ui.nowSub, listSub:ui.listSub }); render(); }

let ed = null; // { kind, id, rule }
function openEditor(kind, id, rule){
  ed = { kind, id, rule: kind === 'vs' ? (rule || 'all') : (kind === 'cm' || kind === 'ct') ? rule : null };
  document.getElementById('edTitle').textContent =
    kind === 'cm' ? 'WAVE ' + rule + ' の作戦（' + nameById(scenById(+id).stage) + '）' :
    kind === 'ct' ? 'WAVE ' + rule.split(':')[0] + '・残り' + rule.split(':')[1] + '秒' : nameById(id);
  document.getElementById('editor').classList.add('open');
  history.pushState({ editor:true }, '');
  drawEditor();
}
function edKey(){ return ed.kind === 'ct' ? 'ct:' + ed.id + ':' + ed.rule : ed.kind === 'cm' ? cmKey(ed.id, ed.rule) : ed.kind === 'coop' ? kCoop(ed.id) : kVs(ed.id, ed.rule === 'all' ? null : ed.rule); }
function drawEditor(){
  const chips = document.getElementById('edChips'), hint = document.getElementById('edHint');
  if (ed.kind === 'vs'){
    const list = [['all','共通']].concat(RULES);
    chips.innerHTML = list.map(([rid, nm]) => {
      const has = memoOf(kVs(ed.id, rid === 'all' ? null : rid));
      return '<button class="chip' + (ed.rule === rid ? ' on' : '') + (has ? ' has' : '') + '" data-chip="' + rid + '">' + nm + '</button>';
    }).join('');
    chips.style.display = '';
    hint.textContent = ed.rule === 'all' ? '「共通」はどのルールのときでも表示されます' : RULE_NAME[ed.rule] + 'のときだけ表示されます';
  } else if (ed.kind === 'ct'){
    // 方角とオオモノ名はタップで追記できる（方角はステージのブイ名で書きたい時は直接入力）
    chips.innerHTML = ['左', '正面', '右', '奥', '手前'].concat(QUICK_BOSSES).map(b => '<button class="chip" data-addtext="' + b + '">' + b + '</button>').join('');
    chips.style.display = '';
    hint.textContent = 'この時刻に湧くもの・方角・動き方をメモ。上のボタンで追記できます（例: 右 テッパン、カタパは自分）';
  } else { chips.innerHTML = ''; chips.style.display = 'none';
    hint.textContent = ed.kind === 'cm' ? 'ばちこんでこのWAVEを開いたとき、一番上に表示されます。短く書くのがおすすめ（例: 右奥タワーは自分 / 残り64秒でSP）' : 'サーモンランでこのステージが来たときに表示されます'; }
  const ta = document.getElementById('memoText');
  ta.value = memos[edKey()] || '';
  document.getElementById('edSaved').textContent = '';
}
let saveTimer = null;
function saveMemo(){
  if (!ed) return;
  const v = document.getElementById('memoText').value;
  if (v.trim()) memos[edKey()] = v; else delete memos[edKey()];
  const ok = save('sm_memos', memos);
  document.getElementById('edSaved').textContent = ok ? '保存しました ✓' : '保存に失敗しました';
  if (ed.kind === 'vs'){
    const chip = document.querySelector('.chip.on'); if (chip) chip.classList.toggle('has', !!v.trim());
  }
}
function closeEditor(fromPop){
  if (!ed) return;
  clearTimeout(saveTimer); saveMemo();
  ed = null;
  document.getElementById('editor').classList.remove('open');
  document.getElementById('memoText').blur();
  if (!fromPop && history.state && history.state.editor) history.back();
  render();
  if (play) drawPlay(false);
}

// ---------- バックアップ ----------
function toast(t){ const el = document.getElementById('toast'); el.textContent = t; el.classList.add('show'); setTimeout(() => el.classList.remove('show'), 2200); }
async function exportMemos(){
  const d = new Date(), stamp = d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
  const blob = new Blob([JSON.stringify({ app:'splat-stage-memo', version:2, exportedAt:d.toISOString(), memos, contests }, null, 2)], { type:'application/json' });
  const name = 'stage-memo-' + stamp + '.json';
  try{
    const file = new File([blob], name, { type:'application/json' });
    if (navigator.canShare && navigator.canShare({ files:[file] })){ await navigator.share({ files:[file], title:name }); return; }
  }catch(e){ if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
function importMemos(file){
  const r = new FileReader();
  r.onload = () => {
    try{
      const j = JSON.parse(r.result);
      const m = j && j.memos;
      if (!m || typeof m !== 'object' || Array.isArray(m)) throw 0;
      const cs = (j.contests && typeof j.contests === 'object') ? j.contests : {};
      const n = Object.keys(m).length, nc = Object.keys(cs).length;
      if (!confirm(n + '件のメモ' + (nc ? 'と' + nc + '件のばちこんシナリオ' : '') + 'を読み込みます。同じものは上書きされます（それ以外は残ります）。よろしいですか？')) return;
      for (const [k0, v] of Object.entries(m)){
        if (typeof v !== 'string' || !/^(coop|vs|cm|ct|sp):/.test(k0)) continue;
        let k = k0;
        // 秒のメモは「64.0」などの書き方を揃える（表示側のキーと一致させるため）
        const mt = k0.match(/^(ct:\d+:\d+:)([\d.]+)$/);
        if (mt){ if (isNaN(parseFloat(mt[2]))) continue; k = mt[1] + fmtT(parseFloat(mt[2])); }
        memos[k] = memos[k] && memos[k] !== v && k !== k0 ? memos[k] + '\n' + v : v;
      }
      for (const [k, v] of Object.entries(cs)) if (v && Array.isArray(v.waves) && v.stageId) contests[k] = v;
      save('sm_memos', memos); save('sm_contests', contests);
      if (nc) migrateOldContests(true);
      render(); toast('読み込みました');
    }catch(e){ alert('このファイルは読み込めませんでした。「書き出す」で作ったファイルを選んでください。'); }
  };
  r.readAsText(file);
}

// ---------- イベント ----------
document.addEventListener('click', e => {
  const t = e.target.closest('button, [data-chip]');
  if (!t) return;
  if (t.closest('#play')) return;
  if (t.dataset.edit){ openEditor(t.dataset.edit, t.dataset.id, t.dataset.rule); return; }
  if (t.dataset.play){ openPlay(+t.dataset.play, +t.dataset.no, t.dataset.start); return; }
  if (t.dataset.addtext && ed){
    const ta = document.getElementById('memoText');
    ta.value = ta.value + (ta.value && !/[\s\n]$/.test(ta.value) ? ' ' : '') + t.dataset.addtext;
    ta.dispatchEvent(new Event('input'));
    return;
  }
  if (t.dataset.chip){ clearTimeout(saveTimer); saveMemo(); ed.rule = t.dataset.chip; drawEditor(); return; }
  if (t.dataset.sub){ setUI({ nowSub:t.dataset.sub }); return; }
  if (t.dataset.lsub){ setUI({ listSub:t.dataset.lsub }); return; }
  if (t.id === 'toggleNext'){ ui.showNext = !ui.showNext; render(); return; }
  if (t.id === 'exportBtn'){ exportMemos(); return; }
});
document.addEventListener('change', e => { if (e.target.id === 'importFile' && e.target.files[0]){ importMemos(e.target.files[0]); e.target.value = ''; } });
document.getElementById('navNow').onclick = () => { setUI({ view:'now' }); document.getElementById('main').scrollTop = 0; };
document.getElementById('navList').onclick = () => { setUI({ view:'list' }); document.getElementById('main').scrollTop = 0; };
document.getElementById('navContest').onclick = () => { autoOpened = false; setUI({ view:'contest' }); document.getElementById('main').scrollTop = 0; };
document.getElementById('reload').onclick = () => refresh(true);
// 画面の「戻る」ボタンは履歴を1つ戻すだけにして、閉じる処理は popstate にまとめる（二重に閉じないため）
document.getElementById('edBack').onclick = () => { if (history.state && history.state.editor) history.back(); else closeEditor(false); };
document.getElementById('playBack').onclick = () => { if (history.state && history.state.play) history.back(); else closePlay(false); };
// 戻る操作は一番上に開いている画面だけを閉じる（作戦メモ編集 → WAVE閲覧 の順）
window.addEventListener('popstate', () => { if (ed) closeEditor(true); else if (play) closePlay(true); });
document.getElementById('memoText').addEventListener('input', () => {
  document.getElementById('edSaved').textContent = '入力中…';
  clearTimeout(saveTimer); saveTimer = setTimeout(saveMemo, 500);
});
// アプリに戻ってきたとき：時間帯が変わっていれば取り直し、そうでなくても表示時刻を更新
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible'){ if (stale()) refresh(); else render(); }
  else if (ed){ clearTimeout(saveTimer); saveMemo(); }
});
// 開きっぱなしでも時間帯の切り替わりに追従
setInterval(() => { if (document.visibilityState === 'visible' && !ed && stale()) refresh(); }, 60e3);

render();
refresh();
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
